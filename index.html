  const cols=[
    {id:'name',label:'Hráčka',get:p=>null,display:p=>p.name,noSort:true},
    {id:'overall',label:'Overall',
      get:p=>overallForPlayer(p,norms,ovMax).score,
      display:(p,v)=>{
        if(v==null)return'<span style="color:var(--gm)">–</span>';
        const o=overallForPlayer(p,norms,ovMax);
        const star=o.incomplete?`<span title="Naměřeno ${o.n} z ${o.total} metrik (nejtestovanější hráčka v týmu má ${ovMax})" style="color:var(--acc);cursor:help">★</span>`:'';
        return `<b style="font-family:'Bebas Neue',sans-serif;font-size:1.05rem;color:${overallColor(o.tAvg)}">${v}</b>${star}`;
      },
      sortVal:p=>overallForPlayer(p,norms,ovMax).score??-Infinity,
      lowerBetter:false},
    ...phA.map(m=>({
      id:'ph_'+m.id,
      label:m.label.split(' ')[0]+'<br><small>'+m.unit+'</small>',
      get:p=>{
        if(m.id==='dosah'){const s=lS(p);return calcVys(s);}
        return lS(p)?.physical?.[m.id]??null;
      },
      display:(p,v)=>{
        if(v==null)return'<span style="color:var(--gm)">–</span>';
        const t=m.id==='dosah'?tRaw(v,norms['vyskok']):tRaw(v,norms[m.id]);
        const rank=rankIn(active,pp=>{
          const vv=m.id==='dosah'?calcVys(lS(pp)):lS(pp)?.physical?.[m.id];
          return vv;
        },m.lowerBetter);
        const r=rank(p);
        return `${v}<span class="ov-rank">${r?'#'+r:''}</span>${t!=null?`<span class="ts-badge ${tBadgeCls(t)}" style="font-size:0.6rem;padding:1px 4px;margin-left:3px">T=${t}</span>`:''}`;
      },
      sortVal:p=>{const v=m.id==='dosah'?calcVys(lS(p)):lS(p)?.physical?.[m.id];return v??-Infinity;},
      lowerBetter:m.lowerBetter,
    })),
    {id:'ph_vyskok',label:'Výskok<br><small>cm</small>',
      get:p=>calcVys(lS(p)),
      display:(p,v)=>{if(v==null)return'<span style="color:var(--gm)">–</span>';const t=tRaw(v,norms['vyskok']);const r=rankIn(active,pp=>calcVys(lS(pp)),false)(p);return `${v}<span class="ov-rank">${r?'#'+r:''}</span>${t!=null?`<span class="ts-badge ${tBadgeCls(t)}" style="font-size:0.6rem;padding:1px 4px;margin-left:3px">T=${t}</span>`:''}`;},
      sortVal:p=>calcVys(lS(p))??-Infinity,lowerBetter:false},
    ...gaA.filter(m=>m.id!=='utok_cil'&&m.id!=='utok_pole').map(m=>({
      id:'ga_'+m.id,
      label:gameAbbr(m)+'<br><small>%</small>',
      get:p=>{const gs=gameScore(lS(p)?.game,m.id);return gamePct(gs);},
      display:(p,v)=>{if(v==null)return'<span style="color:var(--gm)">–</span>';const pct=Math.round(v*100);const t=tRaw(v,norms[m.id]);const r=rankIn(active,pp=>{const gs=gameScore(lS(pp)?.game,m.id);return gamePct(gs);},false)(p);return `${pct}%<span class="ov-rank">${r?'#'+r:''}</span>${t!=null?`<span class="ts-badge ${tBadgeCls(t)}" style="font-size:0.6rem;padding:1px 4px;margin-left:3px">T=${t}</span>`:''}`;},
      sortVal:p=>{const gs=gameScore(lS(p)?.game,m.id);return gamePct(gs)??-Infinity;},lowerBetter:false})),
    // Útok na cíl / Útok do pole: sloučeno do jednoho sloupce (activeAttackMetricId) —
    // každá hráčka se ukazuje na variantě, na které zrovna je, s ikonkou podle stupně.
    ...(gaA.some(m=>m.id==='utok_cil'||m.id==='utok_pole')?[{
      id:'ga_utok',label:'Útok<br><small>%</small>',
      get:p=>{const mid=activeAttackMetricId(p);const gs=gameScore(lS(p)?.game,mid);return gamePct(gs);},
      display:(p,v)=>{
        if(v==null)return'<span style="color:var(--gm)">–</span>';
        const mid=activeAttackMetricId(p);
        const pct=Math.round(v*100);const t=tRaw(v,norms[mid]);
        const r=rankIn(active,pp=>{const mid2=activeAttackMetricId(pp);const gs=gameScore(lS(pp)?.game,mid2);return gamePct(gs);},false)(p);
        const tierIcon=mid==='utok_cil'?'🎯':'▫️';
        const tierTitle=mid==='utok_cil'?'Útok na cíl (těžší varianta)':'Útok do pole (lehčí varianta)';
        return `<span title="${tierTitle}">${tierIcon}</span> ${pct}%<span class="ov-rank">${r?'#'+r:''}</span>${t!=null?`<span class="ts-badge ${tBadgeCls(t)}" style="font-size:0.6rem;padding:1px 4px;margin-left:3px">T=${t}</span>`:''}`;
      },
      sortVal:p=>{const mid=activeAttackMetricId(p);const gs=gameScore(lS(p)?.game,mid);return gamePct(gs)??-Infinity;},
      lowerBetter:false,
    }]:[]),
    {id:'milestones',label:'Milníky',
      get:p=>Object.keys(p.milestones||{}).filter(id=>S.config.milestones.find(m=>m.id===id&&m.active!==false)).length,
      display:(p,v)=>{const tot=S.config.milestones.filter(m=>m.active!==false).length;return `${v}/${tot}`;},
      sortVal:p=>Object.keys(p.milestones||{}).filter(id=>S.config.milestones.find(m=>m.id===id&&m.active!==false)).length,
      lowerBetter:false},
    {id:'last_test',label:'Poslední<br><small>test</small>',
      get:p=>lS(p)?.date,
      display:(p,v)=>v?fmtDate(v):'<span style="color:var(--gm)">–</span>',
      sortVal:p=>lS(p)?.date??'',lowerBetter:false},
  ];

  // Sort
  let rows=[...active];
  if(ovSort.col){
    const col=cols.find(c=>c.id===ovSort.col);
    if(col&&typeof col.sortVal==='function'){rows.sort((a,b)=>{const va=col.sortVal(a),vb=col.sortVal(b);if(va===vb)return 0;const r=va<vb?-1:1;return ovSort.asc?r:-r;});}
  }

  const heads=cols.map(col=>{
    if(col.noSort)return`<th style="cursor:default">${col.label}</th>`;
    const cls=ovSort.col===col.id?(ovSort.asc?'sort-asc':'sort-desc'):'';
    return `<th class="${cls}" onclick="ovSortBy('${col.id}')">${col.label}</th>`;
  }).join('');

  const trows=rows.map(p=>{
    const tds=cols.map(col=>{
      if(col.id==='name')return`<td onclick="selectOvPlayer('${p.id}')" style="cursor:pointer;color:var(--gl)">${p.name}${staleDot(p)}</td>`;
      const v=col.get(p);
      return`<td>${col.display(p,v)}</td>`;
    }).join('');
    return`<tr>${tds}</tr>`;
  }).join('');

  el.innerHTML=`
    <h2 style="font-family:'Bebas Neue',sans-serif;font-size:1.45rem;letter-spacing:2px;margin-bottom:4px">📊 Přehled týmu</h2>
    <p style="font-size:0.78rem;color:var(--gm);margin-bottom:14px">Klikni na název sloupce pro řazení · Klikni na jméno pro detail hráčky · <span style="color:var(--acc)">●</span> = bez testu / stará data · <span style="color:var(--acc)">★</span> = overall z neúplných dat · 🎯/▫️ ve sloupci Útok = těžší/lehčí varianta<br>Norma pro Overall a T-skóre: <b>${S.normScope==="current"?"👥 Aktuální tým":"🗃 Celá databáze"}</b> (${normPlayers().length} hráček)</p>
    <div class="ov-wrap"><table class="ov-tbl"><thead><tr>${heads}</tr></thead><tbody>${trows}</tbody></table></div>`;
}

function ovSortBy(col){
  if(ovSort.col===col)ovSort.asc=!ovSort.asc;
  else{ovSort.col=col;ovSort.asc=true;}
  renderOverview();
}
function selectOvPlayer(id){
  S.activeId=id;S.activeTab='physical';
  toggleOverview(); // closes overview
}

// Ranking helper: returns function(player) → rank (1=best)
function rankIn(players,getVal,lowerBetter){
  const vals=players.map(p=>({p,v:getVal(p)})).filter(x=>x.v!=null);
  vals.sort((a,b)=>lowerBetter?a.v-b.v:b.v-a.v);
  return (p)=>{const idx=vals.findIndex(x=>x.p.id===p.id);return idx>=0?idx+1:null;};
}

function buildTsTimeline(p,norms){

      borderColor:COLORS[i%COLORS.length],backgroundColor:'transparent',
      tension:0.3,pointRadius:4,borderWidth:2,spanGaps:true,
    })),

      borderColor:COLORS[(phM.length+1+i)%COLORS.length],backgroundColor:'transparent',
      tension:0.3,pointRadius:4,borderWidth:1.5,spanGaps:true,borderDash:[3,2],

  </div>`;

function drawTsTimeline(p,norms){
  const cv=document.getElementById('tsTimelineC');if(!cv)return;
  const sessions=p.testSessions||[];
  if(sessions.length<2)return;
  const phM=S.config.physical.filter(m=>m.active!==false&&m.spider!==false&&m.id!=='dosah_vyskoku');
  const gaM=S.config.game.filter(m=>m.active!==false);
  const labels=sessions.map(s=>fmtDate(s.date,true));
  const datasets=[
    ...phM.map((m,i)=>({
      label:m.label.split(' ')[0],
      data:sessions.map(s=>tRaw(s.physical?.[m.id],norms[m.id])),
      borderColor:COLORS[i%COLORS.length],backgroundColor:'transparent',
      tension:0.3,pointRadius:4,borderWidth:2,spanGaps:true,
    })),
    {label:'Výskok',data:sessions.map(s=>tRaw(calcVys(s),norms['vyskok'])),
      borderColor:'#5db87a',backgroundColor:'transparent',tension:0.3,pointRadius:4,borderWidth:2,spanGaps:true,borderDash:[5,3]},
    ...gaM.map((m,i)=>({
      label:gameAbbr(m),
      data:sessions.map(s=>tRaw(gamePct(gameScore(s.game,m.id)),norms[m.id])),
      borderColor:COLORS[(phM.length+1+i)%COLORS.length],backgroundColor:'transparent',
      tension:0.3,pointRadius:3,borderWidth:1.5,spanGaps:true,borderDash:[3,2],
    })),
  ];
  const refLinePlugin={id:'refLine',afterDraw(chart){const{ctx,chartArea,scales}=chart;if(!scales.y)return;const y50=scales.y.getPixelForValue(50);ctx.save();ctx.strokeStyle='rgba(120,120,120,0.5)';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(chartArea.left,y50);ctx.lineTo(chartArea.right,y50);ctx.stroke();ctx.fillStyle='#666';ctx.font='9px sans-serif';ctx.fillText('T=50',chartArea.right+4,y50+4);ctx.restore();}};
  CH['tsTimeline']=new Chart(cv,{type:'line',plugins:[refLinePlugin],data:{labels,datasets},options:{
    responsive:true,maintainAspectRatio:false,
    plugins:{legend:{labels:{color:CLEG,font:{size:9},boxWidth:12}}},
    scales:{
      x:{grid:{color:CGRID},ticks:{color:CTICK,font:{size:10}}},
      y:{grid:{color:CGRID},ticks:{color:CTICK,font:{size:10}},
        min:20,max:80,
        afterBuildTicks:axis=>{axis.ticks=[{value:20},{value:30},{value:45},{value:50},{value:60},{value:75},{value:80}];},
      }
    },
    // T=50 line drawn via registered plugin below
  }});
}

function startNewMatch(){
  openModal(`<h2>🏆 Nový zápas</h2>
    <div class="fg"><label>Soupeř</label><input id="lmOpp" type="text" placeholder="Název soupeře"></div>
    <div class="fg"><label>Datum</label><input id="lmDate" type="date" value="${today()}"></div>
    <div class="fg"><label>Sledovat</label>
      <div style="display:flex;gap:8px;margin-top:4px">
        <label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:0.85rem"><input type="radio" name="lmMode" value="body" checked style="width:auto"> ⚡ Body</label>
        <label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:0.85rem"><input type="radio" name="lmMode" value="prijem" style="width:auto"> 📥 Příjem</label>
        <label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:0.85rem"><input type="radio" name="lmMode" value="oboji" style="width:auto"> 📊 Obojí</label>
      </div>
    </div>
    <div class="fg"><label>Poznámka k zápasu (volitelně)</label><textarea id="lmNote" placeholder="Stav týmu, podmínky..."></textarea></div>
    <div class="ma"><button class="btn btn-o" onclick="closeModal()">Zrušit</button><button class="btn btn-p" onclick="createMatch()">Zahájit zápas</button></div>`);
  setTimeout(()=>document.getElementById('lmOpp')?.focus(),80);
}

function createMatch(){
  const opp=document.getElementById('lmOpp').value.trim()||'Neznámý soupeř';
  const date=document.getElementById('lmDate').value;
  const mode=document.querySelector('input[name="lmMode"]:checked')?.value||'oboji';
  const note=document.getElementById('lmNote').value.trim()||undefined;
  LM={id:'m_'+Date.now(),date,opponent:opp,note,mode,sets:[newSet(1)],activeSet:0,finished:false};
  saveLM();
  closeModal();
  openLiveScreen();
}

// ══════════════════════════════════════════════════════════
// LIVE SCREEN (full-page overlay)
// ══════════════════════════════════════════════════════════
function openLiveScreen(){
  loadLM();
  if(!LM)return;
  // Warn before closing browser/tab during live match
  window._lmUnloadHandler=e=>{e.preventDefault();e.returnValue='Máš rozehraný zápas. Zavřít?';return e.returnValue;};
  window.addEventListener('beforeunload',window._lmUnloadHandler);
  const overlay=document.createElement('div');
  overlay.id='liveOverlay';
  overlay.style.cssText='position:fixed;inset:0;background:var(--bg);z-index:300;display:flex;flex-direction:column;overflow:hidden';
  overlay.innerHTML=`
    <div style="background:var(--green-dark,#1a4d22);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;border-bottom:2px solid var(--g)">
      <button onclick="closeLiveScreen()" style="background:transparent;border:none;color:var(--w);font-size:1.1rem;cursor:pointer;padding:4px 8px">✕</button>
      <div style="flex:1;min-width:0">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:2px">🏆 vs ${LM.opponent}</div>
        <div style="font-size:0.62rem;color:#6aaa70;letter-spacing:1px">${fmtDate(LM.date)} · ${{body:'⚡ Body',prijem:'📥 Příjem',oboji:'📊 Obojí'}[LM.mode]}</div>
      </div>
      <span class="live-badge">LIVE</span>
    </div>
    <div style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px" id="liveContent"></div>
`;
  document.body.appendChild(overlay);
  renderLiveContent();
}

function closeLiveScreen(){
  window.removeEventListener('beforeunload',window._lmUnloadHandler);
  document.getElementById('liveOverlay')?.remove();
}

function renderLiveContent(){
  const content=document.getElementById('liveContent');
  if(!content||!LM)return;
  const set=LM.sets[LM.activeSet];
  // FLIP: record positions before update
  const prevPositions={};
  content.querySelectorAll('.live-row[data-pid]').forEach(el=>{
    const pid=el.dataset.pid;
    if(pid)prevPositions[pid]=el.getBoundingClientRect().top;
  });
  const active=getActiveP();

  // Set tabs
  const setTabs=LM.sets.map((s,i)=>`
    <div class="set-tab ${i===LM.activeSet?'active':''} ${s.closed?'closed':''}" onclick="switchLiveSet(${i})">
      Set ${s.num}${s.closed?' ✓':''}
    </div>`).join('');

  // Player rows — sorted by action count desc, then split into with/without data
  const scoredPlayers=active.map(p=>({
    p,
    actionCount:set.actions.filter(a=>a.pid===p.id).length,
    hasData:set.actions.some(a=>a.pid===p.id)
  }));
  scoredPlayers.sort((a,b)=>b.actionCount-a.actionCount);
  const withData=scoredPlayers.filter(x=>x.hasData);
  const withoutData=scoredPlayers.filter(x=>!x.hasData);

  const makeRow=(p,hasData)=>{
    const score=calcBodyScore(p.id, set);
    const recvAvg=calcRecvAvg(p.id, set);
    const scoreColor=score>0?'':score<0?' neg':' zero';
    const bodyHTML=(LM.mode!=='prijem')?`
      <button class="btn-plus" onclick="addAction('${p.id}','body',1)">+</button>
      <span class="live-score${scoreColor}">${score>0?'+':''}${score}</span>
      <button class="btn-minus" onclick="addAction('${p.id}','body',-1)">−</button>`:'';
    const recvPctVal=recvPct(recvAvg);
    const recvCount=set.actions.filter(a=>a.pid===p.id&&a.type==='prijem').length;
    const recvColor=recvPctVal==null?'var(--gm)':recvPctVal>=80?'var(--gl)':recvPctVal>=50?'var(--acc)':'var(--red)';
    const recvHTML=(LM.mode!=='body')?`
      <div class="recv-btns">
        ${[1,3,5].map(v=>{
          const last=lastRecv(p.id,set);
          return`<button class="recv-btn r${v}${last===v?' sel':''}" onclick="addAction('${p.id}','prijem',${v})">${v}</button>`;
        }).join('')}
      </div>
      ${recvPctVal!=null
        ?`<span style="font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:${recvColor};min-width:52px;text-align:right;flex-shrink:0">${recvPctVal}%<span style="font-size:0.65rem;color:var(--gm);font-family:'DM Sans',sans-serif;margin-left:2px">/${recvCount}</span></span>`
        :'<span style="min-width:52px"></span>'}`:'';
    return`<div class="live-row ${hasData?'has-data':''}" data-pid="${p.id}">
      <div class="live-name" style="opacity:${hasData?1:0.45}">${playerLabel(p)}</div>
      ${bodyHTML}
      ${recvHTML}
    </div>`;
  };

  const rowsWithData=withData.map(x=>makeRow(x.p,true));
  const rowsWithout=withoutData.map(x=>makeRow(x.p,false));
  const rows=[
    ...rowsWithData,
    ...(withoutData.length?['<div class="live-section-label">Bez záznamu</div>']:[]),
    ...rowsWithout
  ].join('');

  content.innerHTML=`
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center">
      ${setTabs}
      <button onclick="openActionLog()" title="Zápisy tohoto setu" style="margin-left:auto;background:#1a2e1a;border:2px solid var(--brd);border-radius:8px;color:var(--w);font-size:1rem;width:38px;height:34px;cursor:pointer;flex-shrink:0">📋</button>
      ${!set.closed?'<button onclick="undoAction()" title="Vrátit poslední akci" style="background:#1a3a1e;border:2px solid var(--g);border-radius:8px;color:var(--gl);font-size:1.1rem;width:38px;height:34px;cursor:pointer;flex-shrink:0;font-weight:700">↩</button>':''}
    </div>
    <div class="card" style="margin-bottom:12px">
      <h3>Zadávání ${set.closed?'<span style="color:var(--gm)">(set uzavřen)</span>':''}</h3>
      ${set.closed
        ? '<p style="color:var(--gm);font-size:0.82rem">Set je uzavřen. Klikni na Další set nebo Uzavřít zápas.</p>'
        : rows}
    </div>
    <div id="liveCharts"></div>`;

  // Action buttons — injected into content after render
  const actDiv=document.createElement('div');
  actDiv.style.cssText='padding:10px 0 4px;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px';
  if(!set.closed){
    actDiv.innerHTML=`<button class="btn btn-p" style="flex:1" onclick="closeSet()">✔ Ukončit set</button>`;
  } else if(!LM.finished){
    actDiv.innerHTML=`<button class="btn btn-o" style="flex:1" onclick="addNewSet()">+ Další set</button>
      <button class="btn btn-a" style="flex:1" onclick="finishMatch()">🏁 Ukončit zápas</button>`;
  } else {
    actDiv.innerHTML=`<button class="btn btn-o" style="flex:1" onclick="closeLiveScreen()">✕ Zavřít</button>`;
  }
  content.appendChild(actDiv);

  // FLIP: animate rows from old to new positions
  if(Object.keys(prevPositions).length){
    requestAnimationFrame(()=>{
      content.querySelectorAll('.live-row[data-pid]').forEach(el=>{
        const pid=el.dataset.pid;
        const oldTop=prevPositions[pid];
        if(oldTop==null)return;
        const newTop=el.getBoundingClientRect().top;
        const delta=oldTop-newTop;
        if(Math.abs(delta)<2)return; // no movement
        el.style.transform=`translateY(${delta}px)`;
        el.style.transition='none';
        requestAnimationFrame(()=>{
          el.classList.add('flipping');
          el.style.transform='';
          el.style.transition='';
          el.addEventListener('transitionend',()=>el.classList.remove('flipping'),{once:true});
        });
      });
    });
  }
  // Draw live charts
  scheduleDraw(()=>drawLiveCharts(set));
}

function switchLiveSet(i){
  LM.activeSet=i;
  saveLM();
  renderLiveContent();
}

function undoAction(){
  const set=LM?.sets[LM.activeSet];
  if(!set||!set.actions.length){toast("Nic ke vrácení","err");return;}
  set.actions.pop();
  saveLM();
  renderLiveContent();
  toast("Poslední akce vrácena ↩");
}

function openActionLog(){
  const set=LM?.sets[LM.activeSet];
  if(!set)return;
  const active=getActiveP();
  const rows=set.actions.map((a,i)=>{
    const p=active.find(x=>x.id===a.pid)||S.players.find(x=>x.id===a.pid);
    const label=p?playerLabel(p):'?';
    const desc=a.type==='body'?(a.value>0?'Bod +1':'Chyba −1'):('Příjem '+a.value);
    const time=new Date(a.ts).toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'});
    return`<div class="me"><div class="ml">${label} <small>${desc} · ${time}</small></div><button class="btn btn-d sm" onclick="removeAction(${i})">✕</button></div>`;
  }).reverse().join('');
  openModal(`<h2>📋 Zápisy — Set ${set.num}</h2>
    <p style="font-size:0.78rem;color:var(--gm);margin-bottom:12px">Smaž konkrétní chybný zápis, ne jen ten poslední. Nejnovější nahoře.</p>
    <div style="max-height:50vh;overflow-y:auto">${rows||'<div class="no-data">Zatím žádné zápisy</div>'}</div>
    <div class="ma"><button class="btn btn-p" onclick="closeModal()">Zavřít</button></div>`);
}
function removeAction(i){
  const set=LM?.sets[LM.activeSet];
  if(!set||!set.actions[i])return;
  set.actions.splice(i,1);
  saveLM();
  closeModal();
  renderLiveContent();
  toast("Zápis smazán");
}

function addAction(pid, type, value){
  const set=LM.sets[LM.activeSet];
  if(set.closed)return;
  if(navigator.vibrate)navigator.vibrate(10);
  set.actions.push({pid,type,value,ts:Date.now()});
  saveLM();
  // Auto-backup to S.matches every 5 actions
  const totalActions=LM.sets.reduce((s,st)=>s+st.actions.length,0);
  if(totalActions%5===0){autoBackupMatch();}
  renderLiveContent();
}

function autoBackupMatch(){
  if(!LM||LM.finished)return;
  const snapshot={...JSON.parse(JSON.stringify(LM)),_autosave:true};
  upsertMatch(snapshot);
  save();
}

function calcBodyScore(pid, set){
  return set.actions.filter(a=>a.pid===pid&&a.type==='body').reduce((s,a)=>s+a.value,0);
}
function calcRecvAvg(pid, set){
  const vals=set.actions.filter(a=>a.pid===pid&&a.type==='prijem').map(a=>a.value);
  return vals.length?vals.reduce((s,v)=>s+v,0)/vals.length:null;
}
function recvPct(avg){if(avg==null)return null;return Math.round((1-(avg-1)/4)*100);}
function lastRecv(pid, set){
  const vals=set.actions.filter(a=>a.pid===pid&&a.type==='prijem');
  return vals.length?vals[vals.length-1].value:null;
}

function closeSet(){
  confirmAction('Ukončit set?',()=>{
    const set=LM.sets[LM.activeSet];
    set.closed=true;saveLM();renderLiveContent();showSetSummary(set);
  });
}

function showSetSummary(set){
  const active=getActiveP();
  const withData=active.filter(p=>set.actions.some(a=>a.pid===p.id));
  if(!withData.length){toast("Set "+set.num+" uzavřen");return;}
  openMatchStatsModal("Set "+set.num+" — statistiky",[set],withData,true,null,false,LM.mode);
}

function addNewSet(){
  const nextNum=LM.sets.length+1;
  LM.sets.push(newSet(nextNum));
  LM.activeSet=LM.sets.length-1;
  saveLM();
  renderLiveContent();
}

function finishMatch(){
  confirmAction('Ukončit zápas?',()=>{
    LM.finished=true;upsertMatch(LM);save();
    localStorage.removeItem(lmKey());
    const finished=JSON.parse(JSON.stringify(LM));LM=null;
    renderLiveContent();showMatchSummary(finished);
  });
}

function upsertMatch(match){
  if(!S.matches)S.matches=[];
  const clean=JSON.parse(JSON.stringify(match));
  delete clean._autosave;
  const idx=S.matches.findIndex(x=>x.id===clean.id);
  if(idx>=0)S.matches[idx]=clean;
  else S.matches.push(clean);
}

function showMatchSummary(match){
  const m=match||LM;
  if(!m)return;
  const active=getActiveP();
  const allActions=m.sets.flatMap(s=>s.actions);
  let potm=null; let potmScore=-Infinity;
  active.forEach(p=>{
    const hasData=allActions.some(a=>a.pid===p.id);
    if(!hasData)return;
    let score;
    if(m.mode==='body'){
      score=allActions.filter(a=>a.pid===p.id&&a.type==='body').reduce((s,a)=>s+a.value,0);
    } else if(m.mode==='prijem'){
      const rv=allActions.filter(a=>a.pid===p.id&&a.type==='prijem').map(a=>a.value);
      score=rv.length?recvPct(rv.reduce((s,v)=>s+v,0)/rv.length):-Infinity;
    } else {
      const body=allActions.filter(a=>a.pid===p.id&&a.type==='body').reduce((s,a)=>s+a.value,0);
      const rv=allActions.filter(a=>a.pid===p.id&&a.type==='prijem').map(a=>a.value);
      const recvAvgPct=rv.length?recvPct(rv.reduce((s,v)=>s+v,0)/rv.length):0;
      // Max recv count across all players for normalization
      const maxRecv=Math.max(1,...active.map(pp=>allActions.filter(a=>a.pid===pp.id&&a.type==='prijem').length));
      const recvIndex=recvAvgPct*(rv.length/maxRecv);
      score=body*2+recvIndex/2;
    }
    if(score>potmScore){potmScore=score;potm=p;}
  });
  const potmStatStr=m.mode==='body'?`Body: ${potmScore>0?'+':''}${Math.round(potmScore)}`
    :m.mode==='prijem'?`Příjem: ${Math.round(potmScore)}%`
    :`Kombinovaný index: ${Math.round(potmScore)}`;
  const potmHtml=potm?`<div class="potm"><div class="potm-title">⭐ Hráčka zápasu</div><div class="potm-name">${potm.name}</div><div class="potm-stats">${potmStatStr}</div></div>`:'';
  const allPlayers=active.filter(p=>allActions.some(a=>a.pid===p.id));
  openMatchStatsModal("🏁 Zápas ukončen — vs "+m.opponent,m.sets,allPlayers,false,potmHtml,true,m.mode);
}

// ══════════════════════════════════════════════════════════
// LIVE CHARTS
// ══════════════════════════════════════════════════════════
const LCH={};

function drawLiveCharts(set){
  const wrap=document.getElementById('liveCharts');
  if(!wrap)return;
  const active=getActiveP();
  const withData=active.filter(p=>set.actions.some(a=>a.pid===p.id));
  if(!withData.length){wrap.innerHTML='';return;}

  const showBody=LM.mode!=='prijem';
  const showRecv=LM.mode!=='body';

  // Chart 1: Horizontal bar — body scores
  let barHtml='', lineHtml='', recvHtml='', quadHtml='';

  if(showBody){
    barHtml=`<div class="card" style="margin-bottom:10px"><h3>⚡ Pořadí — Body (${set.closed?'Uzavřený set':'Průběh'})</h3><div class="cw"><canvas id="lc_bar"></canvas></div></div>`;
    lineHtml=`<div class="card" style="margin-bottom:10px"><h3>📈 Kumulativní průběh setu</h3><div class="cw"><canvas id="lc_line"></canvas></div></div>`;
  }
  if(showRecv){
    recvHtml=`<div class="card" style="margin-bottom:10px"><h3>📥 Příjem — průměrná známka</h3><div class="cw"><canvas id="lc_recv"></canvas></div></div>`;
  }
  if(showBody&&showRecv&&withData.length>1){
    quadHtml=`<div class="card" style="margin-bottom:10px"><h3>📊 Přehled: Body × Příjem</h3><div class="quad-wrap"><canvas id="lc_quad"></canvas></div></div>`;
  }

  wrap.innerHTML=barHtml+lineHtml+recvHtml+quadHtml;
  Object.values(LCH).forEach(ch=>{try{ch.destroy();}catch(e){}});
  Object.keys(LCH).forEach(k=>delete LCH[k]);

  // ── Bar chart (body scores sorted) ──
  if(showBody){
    const sorted=[...withData].filter(p=>set.actions.some(a=>a.pid===p.id&&a.type==='body'))
      .sort((a,b)=>calcBodyScore(b.id,set)-calcBodyScore(a.id,set));
    const scores=sorted.map(p=>calcBodyScore(p.id,set));
    const colors=scores.map(s=>s>0?CG:s<0?'#7a2a2a':'#444');
    const cv=document.getElementById('lc_bar');
    if(cv&&sorted.length){
      LCH.bar=new Chart(cv,{type:'bar',data:{
        labels:sorted.map(p=>playerLabel(p)),
        datasets:[{data:scores,backgroundColor:colors,borderRadius:5,borderWidth:0}]
      },options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false}},
        scales:{x:{grid:{color:CGRID},ticks:{color:CTICK,font:{size:10}}},
                y:{grid:{display:false},ticks:{color:CW,font:{size:11}}}}}});
    }

    // ── Cumulative line chart ──
    const cv2=document.getElementById('lc_line');
    if(cv2){
      const bodyActions=set.actions.filter(a=>a.type==='body');
      const pids=[...new Set(bodyActions.map(a=>a.pid))];
      const datasets=pids.map((pid,i)=>{
        const p=active.find(x=>x.id===pid);
        let cum=0;
        const data=bodyActions.map(a=>{if(a.pid===pid)cum+=a.value;return cum;});
        return{label:p?playerLabel(p):pid,data,borderColor:COLORS[i%COLORS.length],
          backgroundColor:'transparent',tension:0.3,pointRadius:3,borderWidth:2,spanGaps:true};
      });
      const labels=bodyActions.map((_,i)=>'#'+(i+1));
      LCH.line=new Chart(cv2,{type:'line',data:{labels,datasets},options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{labels:{color:CLEG,font:{size:10}}}},
        scales:{x:{grid:{color:CGRID},ticks:{color:CTICK,font:{size:9}}},
                y:{grid:{color:CGRID},ticks:{color:CTICK,font:{size:10}}}}}});
    }
  }

  // ── Recv bar chart ──
  if(showRecv){
    const recvPlayers=withData.filter(p=>set.actions.some(a=>a.pid===p.id&&a.type==='prijem'))
      .sort((a,b)=>calcRecvAvg(a.id,set)-calcRecvAvg(b.id,set));
    const cv3=document.getElementById('lc_recv');
    if(cv3&&recvPlayers.length){
      const avgs=recvPlayers.map(p=>Math.round(calcRecvAvg(p.id,set)*10)/10);
      const pcts=avgs.map(a=>recvPct(a));
      const colors3=pcts.map(v=>v>=80?CG:v>=50?'#787820':'#7a2a2a');
      LCH.recv=new Chart(cv3,{type:'bar',data:{
        labels:recvPlayers.map(p=>playerLabel(p)),
        datasets:[{data:pcts,backgroundColor:colors3,borderRadius:5,borderWidth:0}]
      },options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+roundN(ctx.parsed.x)+'% ('+avgs[ctx.dataIndex]+')'}}},
        scales:{x:{grid:{color:CGRID},ticks:{color:CTICK,font:{size:10},callback:v=>roundN(v)+'%'},min:0,max:100},
                y:{grid:{display:false},ticks:{color:CW,font:{size:11}}}}}});
    }
  }

  // ── Quadrant scatter ──
  if(showBody&&showRecv){
    const cv4=document.getElementById('lc_quad');
    if(cv4){
      const pts=withData.filter(p=>{
        const hb=set.actions.some(a=>a.pid===p.id&&a.type==='body');
        const hr=set.actions.some(a=>a.pid===p.id&&a.type==='prijem');
        return hb||hr;
      }).map((p,i)=>({
        x:calcBodyScore(p.id,set),
        y:recvPct(calcRecvAvg(p.id,set))??50,
        label:playerLabel(p),
        color:COLORS[i%COLORS.length]
      }));
      const datasets=pts.map(pt=>({
        label:pt.label,data:[{x:pt.x,y:pt.y}],
        backgroundColor:pt.color,pointRadius:8,pointHoverRadius:10,
      }));
      LCH.quad=new Chart(cv4,{type:'scatter',data:{datasets},options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{labels:{color:CLEG,font:{size:10},boxWidth:10}},
          tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: body ${ctx.parsed.x>0?'+':''}${roundN(ctx.parsed.x)}, příjem ${roundN(ctx.parsed.y)}%`}}},
        scales:{
          x:{title:{display:true,text:'Body (+/−)',color:CTICK,font:{size:10}},
             grid:{color:CGRID},ticks:{color:CTICK,font:{size:9}}},
          y:{title:{display:true,text:'Příjem %',color:CTICK,font:{size:10}},
             grid:{color:CGRID},ticks:{color:CTICK,font:{size:9},callback:v=>roundN(v)+'%'},min:0,max:100}
        }
      }});
    }
  }
}

// ZÁLOŽKA ZÁPAS v profilu hráčky

function buildZapasTab(){
  const p=gP();
  const matches=S.matches||[];
  const pMatches=matches.filter(m=>m.sets.some(s=>s.actions.some(a=>a.pid===p.id)));

  if(!pMatches.length){
    return`<div class="empty" style="height:35vh">
      <div class="ei">🏆</div>
      <div style="font-size:0.95rem;font-weight:600">Žádné zápasové záznamy</div>
      <div style="font-size:0.8rem;color:var(--gm)">Spusť živý zápas tlačítkem 🏆 Zápas v hlavičce</div>
    </div>`;
  }

  // Summary stats across all matches
  const allActions=pMatches.flatMap(m=>m.sets.flatMap(s=>s.actions.filter(a=>a.pid===p.id)));
  const totalBody=allActions.filter(a=>a.type==='body').reduce((s,a)=>s+a.value,0);
  const recvVals=allActions.filter(a=>a.type==='prijem').map(a=>a.value);
  const recvAvg=recvVals.length?(recvVals.reduce((s,v)=>s+v,0)/recvVals.length).toFixed(2):null;

  const summaryCards=`<div class="g2" style="margin-bottom:14px">
    <div class="card" style="text-align:center">
      <h3>Celkové body</h3>
      <div class="mv ${totalBody>0?'':totalBody<0?'':''}" style="font-size:2rem;color:${totalBody>0?'var(--gl)':totalBody<0?'var(--red)':'var(--gm)'}">${totalBody>0?'+':''}${totalBody}</div>
      <div style="font-size:0.75rem;color:var(--gm);margin-top:4px">${pMatches.length} zápasů · ${allActions.filter(a=>a.type==='body').length} akcí</div>
    </div>
    ${recvAvg?`<div class="card" style="text-align:center">
      <h3>Průměr příjem</h3>
      <div class="mv" style="font-size:2rem;color:${recvAvg<=2?'var(--gl)':recvAvg<=3.5?'var(--acc)':'var(--red)'}">${recvAvg}<span style="font-size:1rem;color:var(--gm);font-family:'DM Sans',sans-serif;font-weight:400;margin-left:6px">${recvPct(parseFloat(recvAvg))}%</span></div>
      <div style="font-size:0.75rem;color:var(--gm);margin-top:4px">${recvVals.length} hodnocení</div>
    </div>`:'<div class="card"><h3>Příjem</h3><p class="no-data">Žádná data</p></div>'}
  </div>`;

  // Match list — last 3 + show all button
  const allSorted=pMatches.slice().reverse();
  const makeMatchCard=(m,closeFirst)=>{
    const mActions=m.sets.flatMap(s=>s.actions.filter(a=>a.pid===p.id));
    const mBody=mActions.filter(a=>a.type==='body').reduce((s,a)=>s+a.value,0);
    const mRecv=mActions.filter(a=>a.type==='prijem');
    const mRecvAvg=mRecv.length?(mRecv.reduce((s,a)=>s+a.value,0)/mRecv.length).toFixed(1):null;
    const onclick=closeFirst?`closeModal();openMatchDetail('${m.id}')`:`openMatchDetail('${m.id}')`;
    return`<div class="match-card" onclick="${onclick}">
      <div class="match-card-head">
        <span class="match-card-opp">vs ${m.opponent}</span>
        <span class="match-card-date">${fmtDate(m.date)}</span>
        <span class="match-card-mode">${{body:'⚡ Body',prijem:'📥 Příjem',oboji:'📊 Obojí'}[m.mode]}</span>
      </div>
      <div style="font-size:0.8rem;color:var(--gm)">
        ${mActions.filter(a=>a.type==='body').length?`Body: <b style="color:${mBody>0?'var(--gl)':mBody<0?'var(--red)':'var(--gm)'}">${mBody>0?'+':''}${mBody}</b>`:''} 
        ${mRecvAvg?`Příjem: <b style="color:${mRecvAvg<=2?'var(--gl)':mRecvAvg<=3.5?'var(--acc)':'var(--red)'}">${mRecvAvg} (${recvPct(parseFloat(mRecvAvg))}%)</b>`:''}
        · ${m.sets.length} ${m.sets.length===1?'set':'setů'}
      </div>
    </div>`;
  };
  const hasMore=allSorted.length>3;
  const matchList=allSorted.slice(0,3).map(m=>makeMatchCard(m,false)).join('')
    +(hasMore?`<button class="btn btn-o" style="width:100%;margin-top:6px;font-size:0.8rem" onclick="openMatchLibrary('${p.id}')">📚 Všechny záznamy (${allSorted.length})</button>`:'');

  // History charts
  const histBodyData=pMatches.map(m=>{
    const sc=m.sets.flatMap(s=>s.actions).filter(a=>a.pid===p.id&&a.type==='body').reduce((s,a)=>s+a.value,0);
    return{x:fmtDate(m.date,true),y:sc};
  });
  const histRecvData=pMatches.map(m=>{
    const vals=m.sets.flatMap(s=>s.actions).filter(a=>a.pid===p.id&&a.type==='prijem').map(a=>a.value);
    return vals.length?{x:fmtDate(m.date,true),y:Math.round(vals.reduce((s,v)=>s+v,0)/vals.length*10)/10}:null;
  }).filter(Boolean);

  const histCharts=`<div class="g2">
    ${histBodyData.length>1?`<div class="card"><h3>Body — vývoj v čase</h3><div class="cw"><canvas id="zh_body"></canvas></div></div>`:''}
    ${histRecvData.length>1?`<div class="card"><h3>Příjem — vývoj v čase</h3><div class="cw"><canvas id="zh_recv"></canvas></div></div>`:''}
  </div>`;

  setTimeout(()=>{
    const cvb=document.getElementById('zh_body');
    if(cvb&&histBodyData.length>1){
      CH['zh_body']=new Chart(cvb,{type:'bar',data:{
        labels:histBodyData.map(d=>d.x),
        datasets:[{data:histBodyData.map(d=>d.y),
          backgroundColor:histBodyData.map(d=>d.y>0?CG:d.y<0?'#7a2a2a':'#444'),
          borderRadius:4,borderWidth:0}]
      },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{grid:{color:CGRID},ticks:{color:CTICK,font:{size:10}}},
                y:{grid:{color:CGRID},ticks:{color:CTICK,font:{size:10}}}}}});
    }
    const cvr=document.getElementById('zh_recv');
    if(cvr&&histRecvData.length>1){
      CH['zh_recv']=new Chart(cvr,{type:'line',data:{
        labels:histRecvData.map(d=>d.x),
        datasets:[{data:histRecvData.map(d=>d.y),borderColor:'#4a9ee8',
          backgroundColor:'rgba(74,158,232,0.08)',tension:0.35,pointRadius:4,fill:true,borderWidth:2}]
      },options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{grid:{color:CGRID},ticks:{color:CTICK,font:{size:10}}},
                y:{grid:{color:CGRID},ticks:{color:CTICK,font:{size:10}},reverse:true,min:1,max:5}}}});
    }
  },80);

  return summaryCards+`<div class="card"><h3>Záznamy zápasů</h3>${matchList}</div>`+histCharts;
}

function openMatchStatsModal(title, sets, players, isSet, extraHtml, closeScreenOnClose, mode){
  mode=mode||LM?.mode||'oboji';
  const allActions=sets.flatMap(s=>s.actions);
  const showBody=mode!=='prijem';
  const showRecv=mode!=='body';

  // Player rows
  const playerRows=players.map(p=>{
    const body=showBody?allActions.filter(a=>a.pid===p.id&&a.type==='body').reduce((s,a)=>s+a.value,0):null;
    const rv=allActions.filter(a=>a.pid===p.id&&a.type==='prijem').map(a=>a.value);
    const recvAvg=rv.length?rv.reduce((s,v)=>s+v,0)/rv.length:null;
    const pct=recvPct(recvAvg);
    return`<div class="me">
      <div class="ml">${playerLabel(p)}</div>
      ${body!=null?`<span style="color:${body>0?'var(--gl)':body<0?'var(--red)':'var(--gm)'}; font-family:'Bebas Neue',sans-serif;font-size:1.1rem">${body>0?'+':''}${body}</span>`:''}
      ${pct!=null?`<span style="font-size:0.82rem;color:var(--gm);margin-left:8px">${pct}% <small>/${rv.length}</small></span>`:''}
    </div>`;
  }).join('');

  // Set tabs for multi-set view
  const setTabsHtml=!isSet&&sets.length>1?
    `<div class="set-tabs" style="margin-bottom:12px">${sets.map((s,i)=>`<div class="set-tab" onclick="switchStatsSet(${i})">${s.closed?'✓ ':''} Set ${s.num}</div>`).join('')}<div class="set-tab active" onclick="switchStatsSet(-1)">Celkem</div></div>`:
    '';

  const closeBtn=closeScreenOnClose
    ?`<button class="btn btn-p" onclick="closeModal();closeLiveScreen()">Zavřít zápas</button>`
    :`<button class="btn btn-p" onclick="closeModal()">Zavřít</button>`;
  const nextBtn=isSet?`<button class="btn btn-o" onclick="closeModal();addNewSet()">+ Další set</button><button class="btn btn-a" onclick="closeModal();finishMatch()">🏁 Ukončit zápas</button>`:'';

  openModal(`<h2>${title}</h2>
    ${extraHtml||''}
    ${setTabsHtml}
    <div class="card" style="margin-bottom:10px"><h3>Hráčky</h3>${playerRows||'<div class="no-data">Žádná data</div>'}</div>
    ${showBody?`<div class="card" style="margin-bottom:10px"><h3>📈 +/− v čase</h3><div class="cw"><canvas id="statsLineC"></canvas></div></div>`:''}
    ${showRecv&&players.some(p=>allActions.some(a=>a.pid===p.id&&a.type==='prijem'))?`<div class="card" style="margin-bottom:10px"><h3>📥 Příjem</h3><div class="cw"><canvas id="statsRecvC"></canvas></div></div>`:''}
    <div class="ma">${nextBtn}${closeBtn}</div>`);

  setTimeout(()=>{
    // Line chart +/- cumulative
    if(showBody){
      const cv=document.getElementById('statsLineC');
      if(cv){
        const bodyActions=allActions.filter(a=>a.type==='body');
        const pids=[...new Set(bodyActions.map(a=>a.pid))];
        const ds=pids.map((pid,i)=>{
          const p=players.find(x=>x.id===pid);
          let cum=0;
          const data=bodyActions.map(a=>{if(a.pid===pid)cum+=a.value;return cum;});
          return{label:p?playerLabel(p):pid,data,borderColor:COLORS[i%COLORS.length],backgroundColor:'transparent',tension:0.3,pointRadius:3,borderWidth:2,spanGaps:true};
        });
        new Chart(cv,{type:'line',data:{labels:bodyActions.map((_,i)=>'#'+(i+1)),datasets:ds},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:CLEG,font:{size:10}}}},scales:{x:{grid:{color:CGRID},ticks:{color:CTICK,font:{size:9}}},y:{grid:{color:CGRID},ticks:{color:CTICK,font:{size:10}}}}}});
      }
    }
    // Recv bar
    if(showRecv){
      const cv2=document.getElementById('statsRecvC');
      if(cv2){
        const recvPlayers=players.filter(p=>allActions.some(a=>a.pid===p.id&&a.type==='prijem'))
          .sort((a,b)=>calcRecvAvg(a.id,{actions:allActions})-calcRecvAvg(b.id,{actions:allActions}));
        if(recvPlayers.length){
          const avgs=recvPlayers.map(p=>calcRecvAvg(p.id,{actions:allActions}));
          const pcts=avgs.map(a=>recvPct(a));
          const colors=pcts.map(v=>v>=80?CG:v>=50?'#787820':'#7a2a2a');
          new Chart(cv2,{type:'bar',data:{labels:recvPlayers.map(p=>playerLabel(p)),datasets:[{data:pcts,backgroundColor:colors,borderRadius:4,borderWidth:0}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>roundN(ctx.parsed.x)+'%'}}},scales:{x:{grid:{color:CGRID},ticks:{color:CTICK,font:{size:10},callback:v=>roundN(v)+'%'},min:0,max:100},y:{grid:{display:false},ticks:{color:CW,font:{size:11}}}}}});
        } else cv2.parentElement.innerHTML='<div class="no-data">Žádná data</div>';
      }
    }
  },80);
}

function openMatchDetail(mid){
  const m=(S.matches||[]).find(x=>x.id===mid);
  if(!m)return;
  const active=getActiveP();
  const allPlayers=[...getActiveP(),...(S.players.filter(p=>p.archived))];

  const setBlocks=m.sets.map(set=>{
    const withData=allPlayers.filter(p=>set.actions.some(a=>a.pid===p.id));
    if(!withData.length)return`<div style="color:var(--gm);font-size:0.82rem;margin-bottom:8px">Set ${set.num}: žádná data</div>`;
    const rows=withData.map(p=>{
      const score=calcBodyScore(p.id,set);
      const recvAvg=calcRecvAvg(p.id,set);
      return`<div class="me">
        <div class="ml">${playerLabel(p)}</div>
        ${m.mode!=='prijem'?`<span style="color:${score>0?'var(--gl)':score<0?'var(--red)':'var(--gm)'}">Body: ${score>0?'+':''}${score}</span>`:''}
        ${recvAvg!=null?`<span style="color:var(--gm);margin-left:8px">Příjem: ${recvAvg.toFixed(1)}</span>`:''}
      </div>`;
    }).join('');
    return`<div style="margin-bottom:14px"><div style="font-weight:700;font-size:0.8rem;color:var(--gm);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">Set ${set.num}</div>${rows}</div>`;
  }).join('');

  openModal(`<h2>🏆 vs ${m.opponent}</h2>
    <p style="color:var(--gm);font-size:0.8rem;margin-bottom:14px">${fmtDate(m.date)} · ${m.sets.length} setů${m.note?` · ${m.note}`:''}</p>

    <div class="ma">
      <button class="btn btn-o" onclick="closeModal();openMatchStats('${mid}')">📊 Statistiky</button>
      <button class="btn btn-p" onclick="closeModal()">Zavřít</button>
      <button class="btn btn-d sm" onclick="deleteMatch('${mid}')">✕ Smazat</button>
    </div>`);
}

function renderMatchStats(m, actions, players, mode){
  const el=document.getElementById('statsContent');if(!el)return;
  const showBody=mode!=='prijem';
  const showRecv=mode!=='body';
  const playerRows=players.map(p=>{
    const body=actions.filter(a=>a.pid===p.id&&a.type==='body').reduce((s,a)=>s+a.value,0);
    const rv=actions.filter(a=>a.pid===p.id&&a.type==='prijem').map(a=>a.value);
    const pct=recvPct(rv.length?rv.reduce((s,v)=>s+v,0)/rv.length:null);
    return`<div class="me"><div class="ml">${playerLabel(p)}</div>
      ${showBody?`<span style="color:${body>0?'var(--gl)':body<0?'var(--red)':'var(--gm)'}; font-family:'Bebas Neue',sans-serif;font-size:1.1rem">${body>0?'+':''}${body}</span>`:''}
      ${pct!=null&&showRecv?`<span style="font-size:0.82rem;color:var(--gm);margin-left:8px">${pct}% <small>/${rv.length}</small></span>`:''}
    </div>`;
  }).join('');
  el.innerHTML=`
    <div class="card" style="margin-bottom:10px"><h3>Hráčky</h3>${playerRows||'<div class="no-data">Žádná data</div>'}</div>
    ${showBody?`<div class="card" style="margin-bottom:10px"><h3>📈 +/− v čase</h3><div class="cw"><canvas id="msLine"></canvas></div></div>`:''}
    ${showRecv?`<div class="card"><h3>📥 Příjem</h3><div class="cw"><canvas id="msRecv"></canvas></div></div>`:''}`;
  // Draw charts
  if(showBody){
    const cv=document.getElementById('msLine');
    if(cv){
      const ba=actions.filter(a=>a.type==='body');
      const pids=[...new Set(ba.map(a=>a.pid))];
      const ds=pids.map((pid,i)=>{const p=players.find(x=>x.id===pid);let cum=0;const data=ba.map(a=>{if(a.pid===pid)cum+=a.value;return cum;});return{label:p?playerLabel(p):pid,data,borderColor:COLORS[i%COLORS.length],backgroundColor:'transparent',tension:0.3,pointRadius:3,borderWidth:2,spanGaps:true};});
      new Chart(cv,{type:'line',data:{labels:ba.map((_,i)=>'#'+(i+1)),datasets:ds},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:CLEG,font:{size:10}}}},scales:{x:{grid:{color:CGRID},ticks:{color:CTICK,font:{size:9}}},y:{grid:{color:CGRID},ticks:{color:CTICK,font:{size:10}}}}}});
    }
  }
  if(showRecv){
    const cv2=document.getElementById('msRecv');
    if(cv2){
      const rp=players.filter(p=>actions.some(a=>a.pid===p.id&&a.type==='prijem')).sort((a,b)=>{const avg1=actions.filter(x=>x.pid===a.id&&x.type==='prijem').map(x=>x.value);const avg2=actions.filter(x=>x.pid===b.id&&x.type==='prijem').map(x=>x.value);const r1=avg1.length?avg1.reduce((s,v)=>s+v,0)/avg1.length:5;const r2=avg2.length?avg2.reduce((s,v)=>s+v,0)/avg2.length:5;return r1-r2;});
      if(rp.length){
        const avgs=rp.map(p=>{const rv=actions.filter(a=>a.pid===p.id&&a.type==='prijem').map(a=>a.value);return rv.length?rv.reduce((s,v)=>s+v,0)/rv.length:null;});
        const pcts=avgs.map(a=>recvPct(a)??0);
        new Chart(cv2,{type:'bar',data:{labels:rp.map(p=>playerLabel(p)),datasets:[{data:pcts,backgroundColor:pcts.map(v=>v>=80?CG:v>=50?'#787820':'#7a2a2a'),borderRadius:4,borderWidth:0}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>roundN(ctx.parsed.x)+'%'}}},scales:{x:{grid:{color:CGRID},ticks:{color:CTICK,font:{size:10},callback:v=>roundN(v)+'%'},min:0,max:100},y:{grid:{display:false},ticks:{color:CW,font:{size:11}}}}}});
      }
    }
  }
}

function showMatchTotal(mid){
  const m=(S.matches||[]).find(x=>x.id===mid);if(!m)return;
  const allPlayers=[...getActiveP(),...S.players.filter(p=>p.archived)];
  const withData=allPlayers.filter(p=>m.sets.some(s=>s.actions.some(a=>a.pid===p.id)));
  const tabs=document.querySelectorAll('#statsSetTabs .set-tab');
  tabs.forEach((t,i,a)=>t.classList.toggle('active',i===a.length-1));
  renderMatchStats(m,m.sets.flatMap(s=>s.actions),withData,m.mode);
}

function showMatchSetStats(mid,setIdx){
  const m=(S.matches||[]).find(x=>x.id===mid);if(!m)return;
  const set=m.sets[setIdx];if(!set)return;
  const allPlayers=[...getActiveP(),...S.players.filter(p=>p.archived)];
  const withData=allPlayers.filter(p=>set.actions.some(a=>a.pid===p.id));
  // Update tabs
  const tabs=document.querySelectorAll('#statsSetTabs .set-tab');
  tabs.forEach((t,i)=>t.classList.toggle('active',i===setIdx));
  renderMatchStats(m,set.actions,withData,m.mode);
}

  closeModal();

function deleteTest(idx){
  const p=gP();if(!p)return;
  const s=p.testSessions[idx];
  confirmAction('Smazat test z '+fmtDate(s.date)+'?',()=>{
    p.testSessions.splice(idx,1);
    save();renderDetail();toast('Test smazán');
  });
}

function openEditTest(idx){
  const p=gP();if(!p)return;
  const sess=p.testSessions[idx];if(!sess)return;
  const phA=S.config.physical.filter(m=>m.active!==false);
  const gaA=S.config.game.filter(m=>m.active!==false);
  const phi=phA.map(m=>{
    const v=sess.physical?.[m.id]??'';
    return`<div class="fg"><label>${m.label} (${m.unit})${m.lowerBetter?" — nižší = lepší":m.id==="dosah_vyskoku"?" — výskok se dopočítá":""}</label><input type="number" id="ep_${m.id}" step="0.1" value="${v}" placeholder="–"></div>`;
  }).join('');
  const gai=gaA.map(m=>{
    const gs=gameScore(sess.game,m.id);
    return`<div class="fg"><label>${m.label} (výchozí: ${m.defaultMax} pokusů)</label><div class="fr"><div><label style="font-size:0.62rem;color:var(--gm)">Úspěšné</label><input type="number" id="eg_s_${m.id}" value="${gs?gs.score:''}" placeholder="–"></div><div><label style="font-size:0.62rem;color:var(--gm)">Pokusy</label><input type="number" id="eg_a_${m.id}" value="${gs?gs.attempts:m.defaultMax}" placeholder="${m.defaultMax}"></div></div></div>`;
  }).join('');
  openModal(`<h2>✎ Upravit test</h2>
    <div class="fg"><label>Datum</label><input type="date" id="ep_date" value="${sess.date}"></div>
    <hr class="sep"><span class="slbl">💪 Fyzické testy</span>${phi}
    <hr class="sep"><span class="slbl">🎯 Herní testy</span>${gai}
    <hr class="sep">
    <div class="fg"><label>Poznámka k testování</label><textarea id="ep_note">${sess.note||''}</textarea></div>
    <div class="ma"><button class="btn btn-o" onclick="closeModalConfirm()">Zrušit</button><button class="btn btn-p" onclick="saveEditTest(${idx})">Uložit</button></div>`);
  setTimeout(snapModal,90);
}

function saveEditTest(idx){
  const p=gP();if(!p)return;
  const sess=p.testSessions[idx];if(!sess)return;
  sess.date=document.getElementById('ep_date').value;
  S.config.physical.filter(m=>m.active!==false).forEach(m=>{
    const v=parseFloat(document.getElementById('ep_'+m.id)?.value);
    if(!isNaN(v))sess.physical[m.id]=v;else delete sess.physical[m.id];
  });
  S.config.game.filter(m=>m.active!==false).forEach(m=>{
    const s=parseInt(document.getElementById('eg_s_'+m.id)?.value);
    const a=parseInt(document.getElementById('eg_a_'+m.id)?.value)||m.defaultMax;
    if(!isNaN(s))sess.game[m.id]={score:s,attempts:a};else delete sess.game[m.id];
  });
  const note=document.getElementById('ep_note')?.value.trim();
  if(note)sess.note=note;else delete sess.note;
  p.testSessions.sort((a,b)=>a.date.localeCompare(b.date));
  save();closeModal();renderDetail();toast('Test upraven ✓');
}

function deleteMatch(mid){
  confirmAction('Smazat zápasový záznam?',()=>{
    S.matches=(S.matches||[]).filter(m=>m.id!==mid);
    save();renderDetail();toast('Zápas smazán');
  });
}

function confirmAction(msg, onYes){
  openModal('<div style="text-align:center;padding:8px 0"><div style="font-size:2rem;margin-bottom:10px">⚠️</div><h2 style="margin-bottom:8px">'+msg+'</h2><p style="color:var(--gm);font-size:0.82rem;margin-bottom:20px">Tuto akci nelze vrátit.</p><div style="display:flex;gap:10px;justify-content:center"><button class="btn btn-o" style="min-width:100px" onclick="closeModal()">Zpět</button><button class="btn btn-d" style="min-width:100px" id="confirmYesBtn">Potvrdit</button></div></div>');
  setTimeout(()=>{const b=document.getElementById('confirmYesBtn');if(b)b.onclick=()=>{closeModal();onYes();};},50);
}

// Zaznamená stav vstupních polí v aktuálním modálu (pro detekci nezauložených změn)
function snapModal(){
  const els=document.querySelectorAll('#modalContent input, #modalContent textarea');
  _modalSnap=[...els].map(i=>i.type==='checkbox'||i.type==='radio'?i.checked:i.value);
}
// Zavře modál, ale pokud se od otevření něco vyplnilo/změnilo, nejdřív se zeptá
function closeModalConfirm(msg){
  const els=document.querySelectorAll('#modalContent input, #modalContent textarea');
  const cur=[...els].map(i=>i.type==='checkbox'||i.type==='radio'?i.checked:i.value);
  const changed=_modalSnap?cur.some((v,i)=>v!==_modalSnap[i]):cur.some(v=>v!==''&&v!==false);
  if(changed)confirmAction(msg||'Zahodit rozepsané údaje?',closeModal);
  else closeModal();
}
