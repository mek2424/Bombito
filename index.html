<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏐 Bombito</title>
<meta name="description" content="Volejbalová tréninková aplikace — SK Meteor Praha">
<meta name="theme-color" content="#1a4d22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bombito">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<script src="./chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#2a7a35;--gd:#1a4d22;--gl:#3db84a;--w:#f5f7f5;--gm:#828278;--acc:#e8c840;--red:#d05555;--bg:#0d160e;--card:#0f1a10;--brd:#1a2e1a;--sw:228px;--gold-1:#c8a820;--gold-2:#f5e070}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;height:100%}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--w);display:flex;flex-direction:column;max-width:100vw}
header{background:linear-gradient(135deg,#1a4d22,#0f2e14);border-bottom:2px solid var(--g);display:flex;align-items:center;gap:8px;padding:9px 12px;position:sticky;top:0;z-index:200;box-shadow:0 3px 20px rgba(0,0,0,.5);flex-shrink:0;min-width:0;overflow:hidden}
.logo-wrap{width:40px;height:40px;border-radius:50%;overflow:hidden;border:2px solid var(--gl);flex-shrink:0}
.logo-wrap img{width:100%;height:100%;object-fit:cover}
.hd{display:flex;flex-direction:column;line-height:1.2;min-width:0;flex:1;overflow:hidden}
.hd h1{font-family:'Bebas Neue',sans-serif;font-size:1.35rem;letter-spacing:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#subtitleEl{font-size:0.57rem;color:#6aaa70;letter-spacing:2px;text-transform:uppercase;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-weight:500;padding:0;outline:none;width:190px;cursor:pointer}
#subtitleEl:focus{border-bottom:1px solid var(--gl);color:var(--w)}
.hact{margin-left:auto;display:flex;gap:5px;align-items:center;flex-shrink:0}
.btn{cursor:pointer;border:none;border-radius:6px;padding:7px 13px;font-family:'DM Sans',sans-serif;font-size:0.78rem;font-weight:600;transition:all .15s;white-space:nowrap}
.btn-o{background:transparent;border:1.5px solid var(--gl);color:var(--gl)}.btn-o:hover{background:var(--gl);color:#fff}
.btn-p{background:var(--g);color:#fff}.btn-p:hover{background:var(--gl)}
.btn-d{background:transparent;border:1.5px solid var(--red);color:var(--red)}.btn-d:hover{background:var(--red);color:#fff}
.btn-a{background:var(--acc);color:#000}.btn-a:hover{background:#f0d060}
.btn-gray{background:transparent;border:1.5px solid #444;color:#999}.btn-gray:hover{border-color:#888;color:var(--w)}
.btn-gold{background:linear-gradient(90deg,var(--gold-1),var(--gold-2),var(--gold-1));background-size:200%;animation:shimmer 4s linear infinite;color:#000;border:none;font-weight:700}
.sm{padding:5px 10px;font-size:0.73rem}
.icon-btn{background:transparent;border:none;cursor:pointer;color:var(--w);font-size:1.15rem;padding:4px 7px;border-radius:6px;transition:background .15s;flex-shrink:0}
.icon-btn:hover{background:rgba(255,255,255,.1)}
@keyframes shimmer{0%{background-position:0%}100%{background-position:200%}}
.body-wrap{display:flex;flex:1;overflow:hidden;position:relative;height:calc(100vh - 62px)}
#sidebar{width:var(--sw);min-width:var(--sw);background:#090f09;border-right:1px solid var(--brd);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;height:100%;transition:transform .25s ease}
.st{padding:10px 13px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.st span{font-size:0.58rem;letter-spacing:2px;text-transform:uppercase;color:var(--gm)}
.pl{flex:1;overflow-y:auto;overflow-x:hidden;padding:5px;-webkit-overflow-scrolling:touch}
.pc{padding:9px 11px;border-radius:8px;cursor:pointer;margin-bottom:4px;transition:all .2s;border:2px solid transparent;overflow:hidden}
.pc:hover{background:#131d13}
.pc.active{background:#1a3a1e;border-color:var(--g)}
.pc.cmp-sel{border-color:#4a9ee8;background:rgba(74,158,232,.08)}
.pc.has-kap{border-style:solid;animation:borderMove 5s linear infinite;background:rgba(232,200,64,.04)}
.pc.has-kap.active{background:rgba(26,58,30,.9);box-shadow:0 0 0 2px var(--acc),0 0 12px rgba(232,200,64,.4)}
@keyframes borderMove{0%{border-image:linear-gradient(90deg,var(--gold-1) 0%,var(--gold-2) 25%,var(--acc) 50%,var(--gold-2) 75%,var(--gold-1) 100%) 1}50%{border-image:linear-gradient(90deg,var(--gold-2) 0%,var(--acc) 25%,var(--gold-1) 50%,var(--acc) 75%,var(--gold-2) 100%) 1}100%{border-image:linear-gradient(90deg,var(--gold-1) 0%,var(--gold-2) 25%,var(--acc) 50%,var(--gold-2) 75%,var(--gold-1) 100%) 1}}
.pc-name{font-weight:600;font-size:0.84rem;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-b{display:flex;flex-wrap:wrap;gap:3px;min-height:16px}
.bc{font-size:0.55rem;padding:2px 5px;border-radius:7px;background:#152015;color:var(--gl);border:1px solid #2a4a2a;white-space:nowrap}
.bc.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}
.bc.sp{background:linear-gradient(90deg,var(--gold-1),var(--gold-2),var(--acc),var(--gold-2),var(--gold-1));background-size:300%;animation:shimmer 5s linear infinite;color:#000;border:none;font-weight:700}
#sidebarBackdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:149;backdrop-filter:blur(2px)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px;min-width:0;height:100%;-webkit-overflow-scrolling:touch}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:55vh;gap:14px;color:var(--gm);text-align:center}
.empty .ei{font-size:3.5rem}
.pdh{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.pav{width:48px;height:48px;border-radius:50%;background:var(--gd);border:3px solid var(--g);display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:700;flex-shrink:0}
.pdi{flex:1;min-width:0}
.pdi h2{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;letter-spacing:2px;line-height:1}
.pdi p{color:var(--gm);font-size:0.74rem;margin-top:2px}
.brow{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ba{color:#000;padding:3px 10px;border-radius:10px;font-size:0.68rem;font-weight:700;border:2px solid transparent}
.ba.sp{background:linear-gradient(90deg,var(--gold-1),var(--gold-2),var(--acc),var(--gold-2),var(--gold-1));background-size:300%;animation:shimmer 5s linear infinite;box-shadow:0 0 10px rgba(232,200,64,.4)}
.da{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.tabs{display:flex;border-bottom:2px solid var(--brd);margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;cursor:pointer;font-size:0.78rem;font-weight:500;color:var(--gm);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s;white-space:nowrap;flex-shrink:0}
.tab:hover{color:var(--w)}
.tab.active{color:var(--gl);border-bottom-color:var(--gl)}
.card{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:15px;margin-bottom:14px}
.card h3{font-size:0.59rem;letter-spacing:2px;text-transform:uppercase;color:var(--gm);margin-bottom:11px}
.me{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px solid #141e14}
.me:last-child{border-bottom:none}
.me.inactive{opacity:0.35}
.ml{flex:1;font-size:0.84rem;min-width:0}
.ml small{display:block;font-size:0.65rem;color:var(--gm);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.note-btn{cursor:pointer;font-size:0.75rem;opacity:0.4;transition:opacity .15s;flex-shrink:0;background:none;border:none;color:var(--w);padding:4px;min-width:28px;min-height:28px;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.note-btn:hover{opacity:1}
.note-btn.has-note{opacity:.9;color:var(--acc)}
.mv{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;color:var(--gl);letter-spacing:1px;flex-shrink:0}
.mv.calc{color:#5db87a}
.mu{font-size:0.65rem;color:var(--gm);margin-left:1px}
.tr{font-size:0.67rem;padding:2px 5px;border-radius:4px;flex-shrink:0}
.tu{background:#1a421a;color:#5dce5d}.td{background:#421a1a;color:#ce5d5d}.ts{background:#222;color:var(--gm)}
.mi{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #141e14}
.mi:last-child{border-bottom:none}
.mi.inactive{opacity:0.35}
.mck{width:36px;height:36px;border-radius:50%;border:2px solid #2a4a2a;display:flex;align-items:center;justify-content:center;font-size:0.85rem;cursor:pointer;transition:all .2s;flex-shrink:0}
.mck.done{background:var(--g);border-color:var(--g)}
.ml2{flex:1;font-size:0.84rem}
.md2{font-size:0.7rem;color:var(--gm);flex-shrink:0}
.gi{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px solid #141e14}
.gi:last-child{border-bottom:none}
.gi.inactive{opacity:0.35}
.inactive-metrics{margin-top:4px}
.inactive-metrics summary{cursor:pointer;color:var(--gm);padding:6px 0;user-select:none}
.inactive-metrics summary:hover{color:var(--gl)}
.gl2{flex:1;font-size:0.84rem;min-width:0}
.sb{width:75px;height:7px;background:#162016;border-radius:4px;overflow:hidden;flex-shrink:0}
.sf{height:100%;background:var(--g);border-radius:4px;transition:width .4s}
.sc{font-family:'Bebas Neue',sans-serif;font-size:.9rem;min-width:42px;text-align:right;flex-shrink:0}
.cw{position:relative;height:175px;margin-top:8px;width:100%}
.rw{position:relative;height:255px;width:100%}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media(max-width:640px){.g2{grid-template-columns:minmax(0,1fr)}}
.no-data{color:var(--gm);font-size:0.79rem;padding:14px 0;text-align:center}
/* T-SCORE 5 LEVELS */
.ts-badge{font-size:0.67rem;padding:2px 6px;border-radius:10px;font-weight:700;flex-shrink:0;white-space:nowrap}
.ts-legend{background:linear-gradient(90deg,var(--gold-1),var(--gold-2),var(--gold-1));background-size:200%;animation:shimmer 4s linear infinite;color:#000}
.ts-great{background:#1a4a2a;color:var(--gl)}
.ts-avg{background:#1e2a1e;color:#7ab87a}
.ts-low{background:#3a2a0a;color:#e8a030}
.ts-vlow{background:#3a1a00;color:#e06010}
/* NORM BAR */
.norm-bar{background:#0a1a0a;border:1px solid var(--brd);border-radius:8px;padding:10px 13px;display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.norm-bar .nb-label{font-size:0.72rem;color:var(--gm);flex:1;min-width:100px}
.norm-bar .nb-val{color:var(--gl);font-weight:600}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(5px);z-index:500;display:flex;align-items:center;justify-content:center;padding:12px}
.md{background:var(--card);border:1px solid #3a5a3a;border-radius:14px;padding:20px;width:460px;max-width:100%;max-height:90vh;overflow-y:auto;overflow-x:hidden}
.md h2{font-family:'Bebas Neue',sans-serif;font-size:1.35rem;letter-spacing:2px;margin-bottom:14px}
.fg{margin-bottom:11px}
.fg label{display:block;font-size:0.65rem;letter-spacing:1px;text-transform:uppercase;color:var(--gm);margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;background:#07100a;border:1.5px solid #2a4a2a;border-radius:7px;padding:8px 11px;color:var(--w);font-family:'DM Sans',sans-serif;font-size:0.84rem;outline:none;transition:border-color .2s}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--gl)}
.fg textarea{resize:vertical;min-height:75px;line-height:1.5}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.ma{display:flex;gap:7px;justify-content:flex-end;margin-top:14px}
.sep{border:none;border-top:1px solid var(--brd);margin:12px 0}
.slbl{font-size:0.59rem;letter-spacing:2px;text-transform:uppercase;color:var(--gm);margin-bottom:8px;display:block}
.btg{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:7px}
.bt{padding:10px 7px;border-radius:9px;text-align:center;cursor:pointer;border:2px solid var(--brd);background:#07100a;transition:all .2s;font-size:0.78rem;font-weight:600}
.bt:hover{border-color:var(--gl)}
.bt.on{background:rgba(232,200,64,.12);color:var(--acc)}
.bt.sp-on{animation:shimmer 5s linear infinite;color:var(--acc)}
.bi{font-size:1.25rem;margin-bottom:3px}
.ed-item{display:flex;align-items:center;gap:7px;padding:8px 0;border-bottom:1px solid #141e14}
.ed-item:last-child{border-bottom:none}
.ed-lbl{flex:1;font-size:0.84rem;min-width:0}
.ed-lbl small{font-size:0.68rem;color:var(--gm)}
.tog{width:42px;height:22px;border-radius:11px;border:none;cursor:pointer;transition:background .2s;flex-shrink:0;position:relative;background:#333}
.tog.on{background:var(--g)}
.tog::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s}
.tog.on::after{left:23px}
.cmp-chip{padding:5px 11px;border-radius:8px;border:1.5px solid var(--brd);cursor:pointer;font-size:0.78rem;font-weight:500;transition:all .15s;background:#07100a;display:inline-block;margin:3px}
.cmp-chip:hover{border-color:var(--gl)}
.cmp-chip.sel{border-color:var(--gl);background:rgba(61,184,74,.12);color:var(--gl)}
.swatch-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color .15s;flex-shrink:0}
.swatch.sel{border-color:#fff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:9px 20px;border-radius:8px;font-size:0.82rem;font-weight:600;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.4);transition:opacity .4s;pointer-events:none;color:#fff;white-space:nowrap}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a4a2a;border-radius:3px}
@media(max-width:768px){
  #sidebarToggle{display:flex!important}
  #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:150;transform:translateX(-100%);height:100dvh;padding-top:62px}
  #sidebar.open{transform:translateX(0);box-shadow:4px 0 30px rgba(0,0,0,.5)}
  #sidebarBackdrop.open{display:block}
  main{padding:13px}
  .hact{display:none}
  #menuToggle{display:flex!important}
}

/* PDF PRINT */
.pdf-wrap{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:600;display:flex;align-items:flex-start;justify-content:flex-start;padding:24px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex-direction:column}
.pdf-doc{background:#fff;color:#111;border-radius:10px;padding:28px 32px;width:720px;max-width:98vw;font-family:'DM Sans',sans-serif;font-size:0.84rem;line-height:1.5;margin:0 auto 24px}
.pdf-doc h1{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:3px;color:#1a4d22;margin-bottom:2px}
.pdf-sub{font-size:0.75rem;color:#888;margin-bottom:20px}
.pdf-sec{margin-bottom:20px}
.pdf-sec h2{font-size:0.6rem;letter-spacing:2px;text-transform:uppercase;color:#888;border-bottom:2px solid #ddd;padding-bottom:4px;margin-bottom:10px}
.pdf-tbl{width:100%;border-collapse:collapse;font-size:0.81rem}
.pdf-tbl th{text-align:left;padding:5px 8px;background:#f4f4f4;font-weight:600;font-size:0.72rem;color:#555}
.pdf-tbl td{padding:5px 8px;border-bottom:1px solid #eee}
.pdf-tbl tr:last-child td{border-bottom:none}
.pdf-up{color:#1a6e2a;font-weight:700}
.pdf-dn{color:#c0392b;font-weight:700}
.pdf-badge-inline{display:inline-block;padding:1px 7px;border-radius:8px;font-size:0.7rem;font-weight:700;margin:2px}
.pdf-mil-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #f0f0f0;font-size:0.81rem}
.pdf-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.pdf-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid #eee}
@media print{
  @page{size:A4 portrait;margin:12mm 14mm}
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  html,body{width:100%!important;height:auto!important;overflow:visible!important;background:#fff!important}
  body>*{display:none!important}
  body>.pdf-wrap{display:block!important}
  .pdf-wrap{position:static!important;background:none!important;padding:0!important;overflow:visible!important;display:block!important;width:100%!important;height:auto!important}
  .pdf-doc{display:block!important;position:static!important;border-radius:0!important;padding:4mm 0!important;width:100%!important;max-width:none!important;max-height:none!important;box-shadow:none!important;font-size:9.5pt!important;color:#000!important;background:#fff!important;overflow:visible!important;height:auto!important}
  .pdf-actions{display:none!important}
  .pdf-sec{break-inside:avoid;page-break-inside:avoid;margin-bottom:6mm}
  .pdf-tbl{break-inside:auto}
  .pdf-tbl tr{break-inside:avoid;page-break-inside:avoid}
  .pdf-chart-box{break-inside:avoid;page-break-inside:avoid}
  canvas{display:none!important}
  .pdf-chart-img{display:block!important;width:100%!important;height:auto!important;max-height:110px!important;object-fit:contain}
  .pdf-mil-row{break-inside:avoid}
}
.pdf-chart-img{display:none}


/* STALE WARNING */
.stale-dot{width:7px;height:7px;border-radius:50%;background:var(--acc);flex-shrink:0;display:inline-block;margin-left:4px;vertical-align:middle}
.stale-dot.red{background:var(--red)}
/* TEAM OVERVIEW TABLE */
.ov-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ov-tbl{border-collapse:collapse;font-size:0.78rem;white-space:nowrap;min-width:100%}
.ov-tbl th{padding:7px 10px;background:#0a140a;font-size:0.62rem;letter-spacing:1px;text-transform:uppercase;color:var(--gm);border-bottom:2px solid var(--brd);cursor:pointer;user-select:none;position:sticky;top:0;z-index:2}
.ov-tbl th:hover{color:var(--w)}
.ov-tbl th.sort-asc::after{content:" ↑"}
.ov-tbl th.sort-desc::after{content:" ↓"}
.ov-tbl td{padding:7px 10px;border-bottom:1px solid #141e14}
.ov-tbl tr:hover td{background:#0f1a10}
.ov-tbl td:first-child{font-weight:600;position:sticky;left:0;background:#0d160e;z-index:1}
.ov-tbl tr:hover td:first-child{background:#0f1a10}
.ov-rank{font-size:0.65rem;color:var(--gm);margin-left:3px}
/* GROUP TEST MODAL TABLE */
.grp-tbl{width:100%;border-collapse:collapse;font-size:0.8rem}
.grp-tbl th{padding:5px 7px;background:#07100a;font-size:0.62rem;letter-spacing:1px;text-transform:uppercase;color:var(--gm);border-bottom:2px solid var(--brd);white-space:nowrap}
.grp-tbl td{padding:4px 5px;border-bottom:1px solid #141e14;vertical-align:middle}
.grp-tbl td:first-child{font-weight:600;white-space:nowrap;font-size:0.8rem;padding-right:10px}
.grp-tbl input{width:64px;background:#07100a;border:1.5px solid #2a4a2a;border-radius:5px;padding:5px 6px;color:var(--w);font-family:'DM Sans',sans-serif;font-size:0.8rem;outline:none}
.grp-tbl input:focus{border-color:var(--gl)}
/* T-SCORE TIMELINE */
.ts-timeline-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}


/* DROPDOWN MENU */
#menuToggle{display:none;background:transparent;border:none;cursor:pointer;color:var(--w);font-size:1.3rem;padding:6px 8px;border-radius:6px;flex-shrink:0;margin-left:auto}
#menuToggle:hover{background:rgba(255,255,255,.1)}
.menu-dropdown{display:none;position:fixed;top:62px;right:0;background:#0f1a10;border:1px solid var(--brd);border-top:none;border-radius:0 0 12px 12px;padding:8px;min-width:200px;z-index:199;box-shadow:0 8px 30px rgba(0,0,0,.6);flex-direction:column;gap:6px}
.menu-dropdown.open{display:flex}
.menu-dropdown .btn{width:100%;text-align:left;justify-content:flex-start;padding:10px 14px;font-size:0.85rem}
.menu-dropdown label.btn{display:block;cursor:pointer}
.menu-dropdown .sep-line{border:none;border-top:1px solid var(--brd);margin:2px 0}


/* ═══ MATCH TAB ═══ */
.match-header{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.match-header h2{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:2px;flex:1}
.live-badge{background:var(--red);color:#fff;font-size:0.65rem;font-weight:700;padding:3px 8px;border-radius:10px;letter-spacing:1px;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.set-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.set-tab{padding:5px 14px;border-radius:20px;border:1.5px solid var(--brd);cursor:pointer;font-size:0.78rem;font-weight:600;background:#07100a;transition:all .15s}
.set-tab.active{background:var(--g);border-color:var(--g);color:#fff}
.set-tab.closed{border-color:#444;color:var(--gm)}
/* Live input rows */
.live-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #141e14;transition:background .3s;flex-wrap:nowrap}
.live-row.has-data{background:rgba(42,122,53,0.06)}
.live-section-label{font-size:0.6rem;letter-spacing:2px;text-transform:uppercase;color:var(--gm);padding:8px 0 4px;border-bottom:1px solid #1a2e1a;margin-bottom:2px}
@media(orientation:portrait){
  .live-row{flex-wrap:wrap;padding:10px 0;gap:5px}
  .live-name{flex:0 0 100%!important;max-width:100%!important;font-size:0.95rem;padding-bottom:6px;border-bottom:1px solid #1e2e1e;margin-bottom:2px}
}
@media(orientation:landscape){
  .live-row{flex-wrap:nowrap}
  .live-name{max-width:110px}
}
@keyframes liveRowIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.live-section-label{animation:liveRowIn .2s ease both}
.live-row{will-change:transform}
.live-row.flipping{transition:transform .28s cubic-bezier(.4,0,.2,1),opacity .2s ease}
#livePlayerList{transition:all .2s}
.live-row:last-child{border-bottom:none}
.live-name{flex:1;font-weight:600;font-size:0.88rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-score{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:var(--gl);min-width:36px;text-align:center}
.live-score.neg{color:var(--red)}
.live-score.zero{color:var(--gm)}
.btn-plus{background:#1a4a1a;border:2px solid var(--g);color:var(--gl);border-radius:8px;width:44px;height:44px;font-size:1.3rem;font-weight:700;cursor:pointer;transition:all .15s;flex-shrink:0}
.btn-plus:hover,.btn-plus:active{background:var(--g);color:#fff}
.btn-minus{background:#4a1a1a;border:2px solid var(--red);color:var(--red);border-radius:8px;width:44px;height:44px;font-size:1.3rem;font-weight:700;cursor:pointer;transition:all .15s;flex-shrink:0}
.btn-minus:hover,.btn-minus:active{background:var(--red);color:#fff}
.recv-btns{display:flex;gap:8px}
.recv-btn{border-radius:8px;border:2px solid var(--brd);width:44px;height:44px;font-size:0.85rem;font-weight:700;cursor:pointer;transition:all .15s;flex-shrink:0;background:#07100a}
.recv-btn.r1{border-color:var(--g);color:var(--gl)}.recv-btn.r1.sel{background:var(--g);color:#fff}
.recv-btn.r3{border-color:#787820;color:#c8c820}.recv-btn.r3.sel{background:#787820;color:#fff}
.recv-btn.r5{border-color:#7a2a2a;color:#d05555}.recv-btn.r5.sel{background:#7a2a2a;color:#fff}
/* Match history cards */
.match-card{background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:13px;margin-bottom:10px;cursor:pointer;transition:all .15s}
.match-card:hover{border-color:var(--gl)}
.match-card-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.match-card-opp{font-weight:700;font-size:0.9rem;flex:1}
.match-card-date{font-size:0.73rem;color:var(--gm)}
.match-card-mode{font-size:0.65rem;padding:2px 7px;border-radius:8px;background:#1a3a1e;color:var(--gl);font-weight:600}
/* Player of match */
.potm{background:linear-gradient(135deg,rgba(200,168,32,.15),rgba(232,200,64,.05));border:2px solid var(--acc);border-radius:12px;padding:16px;text-align:center;margin-bottom:14px}
.potm-title{font-size:0.62rem;letter-spacing:2px;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.potm-name{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:2px;color:var(--acc)}
.potm-stats{font-size:0.78rem;color:var(--gm);margin-top:4px}
/* Quadrant */
.quad-wrap{position:relative;height:260px;width:100%;margin-top:8px}

</style>
</head>

// Sdílené barvy pro Chart.js grafy — CSS proměnné (var(--x)) canvas nepřečte,
// takže se stejné odstíny drží tady v JS konstantách místo opisování hexu v každém grafu.
// Musí být definované dřív než COLORS/BADGE_COLORS, které je taky používají.
const CGRID='#1a2a1a', CTICK='#828278', CLEG='#b8b8b4', CGREEN='#3db84a', CACC='#e8c840', CG='#2a7a35', CW='#f5f7f5';
const COLORS=[CGREEN,"#4a9ee8","#e87a4a","#c84ae8",CACC,"#4ae8c8","#e84a4a","#9ae84a","#e8624a","#e8a24a","#cfe84a","#6ae84a","#4ae891","#4ad3e8","#5f4ae8","#e84aa9"];

// ═══ LEGENDY GRAFŮ: PUNTÍKY MÍSTO OBDÉLNÍČKŮ ═══
// Globální nastavení pro Chart.js — týká se úplně všech grafů v appce, ne jen Porovnání.
// Chart.js normálně bere barvu výplně puntíku/čtverečku v legendě přímo z dataset.backgroundColor.
// Jenže spousta grafů tu má backgroundColor záměrně (částečně) průhledné — výplň plochy pod
// čárou nebo radarem — takže by puntík vyšel vybledlý nebo úplně neviditelný. Proto: pokud je
// barva výplně "slabá" (transparent / nízká alfa), nahradí se plnou barvou z ohraničení
// (to appka vždy nastavuje natvrdo a neprůhledně). Grafy, co mají plnou barvu rovnou ve výplni
// (např. bodový graf v Zápase), zůstanou beze změny.
function _weakFill(c){
  if(!c||c==='transparent')return true;
  const hexA=typeof c==="string"&&c.match(/^#[0-9a-fA-F]{6}([0-9a-fA-F]{2})$/);
  if(hexA)return parseInt(hexA[1],16)<200;
  const rgba=typeof c==="string"&&c.match(/rgba?\([^)]+,\s*([\d.]+)\s*\)/);
  if(rgba)return parseFloat(rgba[1])<0.6;
  return false;
}
Chart.defaults.plugins.legend.labels.usePointStyle=true;
Chart.defaults.plugins.legend.labels.pointStyle='circle';
Chart.defaults.plugins.legend.labels.boxHeight=8;
const _defGenerateLabels=Chart.defaults.plugins.legend.labels.generateLabels;
Chart.defaults.plugins.legend.labels.generateLabels=chart=>{
  const items=_defGenerateLabels(chart);
  items.forEach(it=>{if(_weakFill(it.fillStyle)&&it.strokeStyle)it.fillStyle=it.strokeStyle;});
  return items;
};

// Zaokrouhlení čísel v popiscích os a tooltipech grafů na max 2 desetinná místa.
// Chart.js si mezikroky osy počítá binární aritmetikou (dělení/násobení desetinných
// čísel), takže bez zaokrouhlení se občas objeví např. "14.400000000000002" místo 14.4.
function roundN(v,n=2){
  if(v==null||isNaN(v))return v;
  const f=Math.pow(10,n);
  return Math.round(v*f)/f;
}

// Klouzavý průměr (okno max 3 body) — pomáhá ve vývojových grafech odlišit jednorázový
// výkyv od skutečného trendu. Na začátku řady okno "smrští" (1. bod = sám sebou, 2. bod =
// průměr prvních dvou), od 3. bodu dál jede plné okno posledních 3 hodnot. Zachovává mezery
// (null zůstává null), i když volající dnes vždy posílají už předfiltrovaná data bez mezer.
function movingAvg3(data){
  return data.map((v,i)=>{
    if(v==null)return null;
    const win=data.slice(Math.max(0,i-2),i+1).filter(x=>x!=null);
    return win.reduce((a,b)=>a+b,0)/win.length;
  });
}

  if(raw){try{S=JSON.parse(raw);}catch(e){}}

    delete m.max; // migrate old format
  });
  S.config.badges.forEach(b=>{if(!b.color)b.color=b.special?CACC:CGREEN;});
  if(!S.normScope)S.normScope="all";
  if(!S.matches)S.matches=[];
  // Migrate: rename "Balony zadarmo" → "Zdarma"
  if(S.config.game){S.config.game.forEach(m=>{if(m.id==='balony_zadarmo'&&m.label==='Balony zadarmo')m.label='Zdarma';});}
  // Migrate: rename "Útok v poli" → "Útok do pole (lehčí varianta)"
  if(S.config.game){S.config.game.forEach(m=>{if(m.id==='utok_pole'&&m.label==='Útok v poli')m.label='Útok do pole (lehčí varianta)';});}
  // Deduplicate matches by ID (keep last occurrence)
  const seen={}; S.matches.forEach(m=>{seen[m.id]=m;});
  S.matches=Object.values(seen).filter(m=>m.finished!==false||!m._autosave);
}

function gP(id){return S.players.find(p=>p.id===(id||S.activeId));}
function lS(p){p=p||gP();return p?.testSessions?.length?p.testSessions[p.testSessions.length-1]:null;}
function pS(p){p=p||gP();return p?.testSessions?.length>1?p.testSessions[p.testSessions.length-2]:null;}
function today(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function playerLabel(p){
  if(!p)return'?';
  if(p.nickname)return p.nickname;
  const parts=p.name.trim().split(' ');
  return parts.length>1?parts[parts.length-1]:parts[0];
}
function fmtDate(d,short){
  if(!d)return'';
  const p=d.split('-');if(p.length<3)return d;
  return short?(p[2]+'/'+p[1]):(p[2]+'/'+p[1]+'/'+p[0].slice(2));
}
function calcVys(s){if(!s)return null;const d=s.physical?.dosah,dv=s.physical?.dosah_vyskoku;return(d!=null&&dv!=null)?Math.round((dv-d)*10)/10:null;}
function hasKap(p){return p?.badges?.some(id=>{const b=S.config.badges.find(x=>x.id===id);return b?.special;});}

// Game value helpers — stored as {score, attempts} or legacy number
function gameScore(sessGame, metricId){
  const v=sessGame?.[metricId];
  if(v==null)return null;
  if(typeof v==="object")return v;
  // legacy: plain number, treat as score out of defaultMax
  const m=S.config.game.find(x=>x.id===metricId);
  return{score:v,attempts:m?.defaultMax||10};
}
function gamePct(gs){if(!gs||!gs.attempts)return null;return gs.score/gs.attempts;}

// ═══ T-SCORE ENGINE ═══
function allVals(metricId,type){
  const vals=[];
  S.players.forEach(p=>{p.testSessions?.forEach(sess=>{
    if(type==="physical"){const v=sess.physical?.[metricId];if(v!=null)vals.push(v);}
    else{const gs=gameScore(sess.game,metricId);const pct=gamePct(gs);if(pct!=null)vals.push(pct);}
  });});
  return vals;
}
function allVyskok(){const vals=[];S.players.forEach(p=>{p.testSessions?.forEach(sess=>{const v=calcVys(sess);if(v!=null)vals.push(v);});});return vals;}
function mean(arr){return arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:null;}
function std(arr,mu){if(arr.length<2)return null;const m=mu??mean(arr);return Math.sqrt(arr.reduce((s,v)=>s+(v-m)*(v-m),0)/(arr.length-1));}
function normPlayers(){
  // "current" = only active (non-archived) players; "all" = everyone incl. archived
  return (S.normScope==="all") ? S.players : S.players.filter(p=>!p.archived);
}
function computeNorms(){
  const pool=normPlayers();
  const norms={};
  // "swing" (Kolo 16 u herních metrik, Kolo 17 i tady) = typická velikost výkyvu
  // mezi dvěma po sobě jdoucími testy TÉŽE hráčky (průměr absolutních rozdílů),
  // spočtená napříč CELÝM poolem (stejná referenční skupina jako norma výše,
  // respektuje normScope). V nativních jednotkách dané metriky (cm, s, ks…).
  S.config.physical.filter(m=>m.active!==false&&m.spider!==false&&m.id!=="dosah_vyskoku").forEach(m=>{
    const vals=[],deltas=[];
    pool.forEach(p=>{
      let prev=null;
      p.testSessions?.forEach(ss=>{
        const v=ss.physical?.[m.id];
        if(v!=null){
          vals.push(v);
          if(prev!=null)deltas.push(Math.abs(v-prev));
          prev=v;
        }
      });
    });
    const mu=mean(vals),sigma=std(vals,mu);
    const swing=deltas.length?mean(deltas):null;
    norms[m.id]={mu,sigma,n:vals.length,lowerBetter:!!m.lowerBetter,swing,swingN:deltas.length};
  });
  const vysVals=[],vysDeltas=[];
  pool.forEach(p=>{
    let prev=null;
    p.testSessions?.forEach(ss=>{
      const v=calcVys(ss);
      if(v!=null){
        vysVals.push(v);
        if(prev!=null)vysDeltas.push(Math.abs(v-prev));
        prev=v;
      }
    });
  });
  norms["vyskok"]={mu:mean(vysVals),sigma:std(vysVals,mean(vysVals)),n:vysVals.length,lowerBetter:false,swing:vysDeltas.length?mean(vysDeltas):null,swingN:vysDeltas.length};
  S.config.game.filter(m=>m.active!==false).forEach(m=>{
    const vals=[],deltas=[];
    pool.forEach(p=>{
      let prev=null;
      p.testSessions?.forEach(ss=>{
        const pct=gamePct(gameScore(ss.game,m.id));
        if(pct!=null){
          vals.push(pct);
          if(prev!=null)deltas.push(Math.abs(pct-prev));
          prev=pct;
        }
      });
    });
    const mu=mean(vals),sigma=std(vals,mu);
    const swing=deltas.length?mean(deltas):null;
    norms[m.id]={mu,sigma,n:vals.length,lowerBetter:false,isPct:true,swing,swingN:deltas.length};
  });
  return norms;
}

  toast(S.normScope==="current"?"👥 Norma: aktuální tým":"🗃 Norma: celá databáze");
  const ovEl=document.getElementById("ovView");

    // výše už samo přes renderCmp() naplánovalo scheduleDraw(drawCmp)) — kvůli
    // generačnímu čítači scheduleDraw (Kolo 5) by ten druhý (nesprávný) scheduleDraw

function scopeChipTitle(){return `Referenční skupina pro Overall a T-skóre: ${S.normScope==="current"?"aktuální tým":"celá databáze (všechny ročníky)"}. Klikni pro přepnutí.`;}
function scopeChipMHtml(){return S.normScope==="current"?"👥 Norma: Aktuální tým":"🗃 Norma: Celá databáze";}
function updateScopeChip(){

  const m=document.getElementById("scopeChipM");

}
function tScore(val,normObj,isPct){
  if(val==null||!normObj)return 0;
  const{mu,sigma,lowerBetter}=normObj;
  if(mu==null)return 50;if(!sigma||sigma===0)return 50;
  const v=isPct?val:val;
  let z=(v-mu)/sigma;if(lowerBetter)z=-z;
  return Math.max(0,Math.min(100,((Math.max(20,Math.min(80,50+10*z))-20)/60)*100));
}
function tRaw(val,normObj){
  if(val==null||!normObj)return null;
  const{mu,sigma,lowerBetter}=normObj;
  if(mu==null||!sigma||sigma===0)return 50;
  let z=(val-mu)/sigma;if(lowerBetter)z=-z;
  return Math.round(50+10*z);
}
// 5-level T-score classification
function tBadgeCls(t){
  if(t==null)return"";
  if(t>=75)return"ts-legend";
  if(t>=60)return"ts-great";
  if(t>=45)return"ts-avg";
  if(t>=30)return"ts-low";
  return"ts-vlow";
}
function tBadgeLabel(t){
  if(t==null)return"";
  if(t>=75)return"★ Legenda";
  if(t>=60)return"▲ Nadprůměr";
  if(t>=45)return"● Průměr";
  if(t>=30)return"▼ Podprůměr";
  return"⚠ Podprůměr";
}

// ═══ OVERALL (souhrnné hodnocení hráčky, styl "FIFA overall") ═══
// Počítá se ze stejných T-skóre, co už kreslí pavoučí grafy (spiderData) — jen zprůměrované.
// Chybějící metrika se do průměru vůbec nepočítá (na rozdíl od pavouka, kde chybí = 0 v grafu).
function overallRaw(sess,norms){
  if(!sess)return{vals:[],n:0,total:0};
  const physM=S.config.physical.filter(m=>m.active!==false&&m.spider!==false&&m.id!=="dosah_vyskoku");
  const gaM=S.config.game.filter(m=>m.active!==false);
  const total=physM.length+1+gaM.length; // +1 = dopočítaný výskok
  const vals=[];
  physM.forEach(m=>{const v=sess.physical?.[m.id];if(v!=null)vals.push(tRaw(v,norms[m.id]));});
  const vys=calcVys(sess);if(vys!=null)vals.push(tRaw(vys,norms["vyskok"]));
  gaM.forEach(m=>{const pct=gamePct(gameScore(sess.game,m.id));if(pct!=null)vals.push(tRaw(pct,norms[m.id]));});
  return{vals,n:vals.length,total};
}
// Přeškáluje průměrné T-skóre (typicky 20–80) na "fifácké" 40–99, stejná logika ořezu jako tScore().
function overallDisplay(tAvg){
  if(tAvg==null)return null;
  const c=Math.max(20,Math.min(80,tAvg));
  return Math.round(40+((c-20)/60)*59);
}
// Nejvyšší počet naměřených overall-metrik v týmu — referenční "úplnost" pro hvězdičku.
function teamMaxCovered(players,norms){
  let max=0;
  players.forEach(p=>{const{n}=overallRaw(lS(p),norms);if(n>max)max=n;});
  return max;
}
function overallForPlayer(p,norms,maxCovered){
  const{vals,n,total}=overallRaw(lS(p),norms);
  if(!n)return{score:null,tAvg:null,n,total,incomplete:true};
  const tAvg=vals.reduce((a,b)=>a+b,0)/vals.length;
  return{score:overallDisplay(tAvg),tAvg,n,total,incomplete:n<maxCovered};
}
function overallColor(tAvg){
  const cls=tBadgeCls(tAvg==null?null:Math.round(tAvg));
  return cls==='ts-legend'?'var(--acc)':cls==='ts-great'?'var(--gl)':cls==='ts-avg'?'#7ab87a':cls==='ts-low'?'#e8a030':cls==='ts-vlow'?'#e06010':'var(--gm)';
}

function exportData(){
  const json=JSON.stringify(S,null,2);
  const filename='bombito_'+today()+'.json';
  localStorage.setItem('bombito_last_export',Date.now());

  // 1. Web Share API with File — best on mobile (opens native share sheet)
  if(navigator.canShare){
    const file=new File([json],filename,{type:'application/json'});
    if(navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'Bombito záloha',text:'Data z aplikace Bombito'})
        .then(()=>toast('Záloha sdílena ✓'))
        .catch(err=>{if(err.name!=='AbortError')fallbackExport(json,filename);});
      return;
    }
  }
  fallbackExport(json,filename);
}

function fallbackExport(json,filename){
  // 2. Blob URL download — funguje na desktopu
  try{
    const b=new Blob([json],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download=filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},200);
    toast('Záloha stažena ✓');
  }catch(e){
    // 3. Clipboard fallback
    navigator.clipboard?.writeText(json)
      .then(()=>toast('Data zkopírována do schránky — vlož do poznámek nebo e-mailu'))
      .catch(()=>showExportModal(json));
  }
}

    <div class="ma"><button class="btn btn-o" onclick="closeModalConfirm()">Zrušit</button><button class="btn btn-p" onclick="saveTest()">Uložit</button></div>`);

function saveTest(){
  const p=gP();if(!p)return;
  const date=document.getElementById("testDate").value;
  const physical={};S.config.physical.filter(m=>m.active!==false).forEach(m=>{const v=parseFloat(document.getElementById("ph_"+m.id)?.value);if(!isNaN(v))physical[m.id]=v;});
  const game={};S.config.game.filter(m=>m.active!==false).forEach(m=>{
    const s=parseInt(document.getElementById("ga_s_"+m.id)?.value);
    const a=parseInt(document.getElementById("ga_a_"+m.id)?.value)||m.defaultMax;
    if(!isNaN(s))game[m.id]={score:s,attempts:a};
  });
  if(!p.testSessions)p.testSessions=[];
  p.testSessions=p.testSessions.filter(s=>s.date!==date);
  const sessNote=document.getElementById("sessNote")?.value.trim()||null;
  p.testSessions.push({date,physical,game,note:sessNote||undefined});
  p.testSessions.sort((a,b)=>a.date.localeCompare(b.date));
  save();closeModal();renderDetail();toast("Test uložen ✓");
}

function trEl(c,pv,lb){if(c==null||pv==null)return"";const diff=c-pv;const cls=diff===0?"ts":((lb?diff<0:diff>0)?"tu":"td");return`<span class="tr ${cls}">${diff>0?"+":""}${diff.toFixed(1)}</span>`;}
function trElPct(c,pv){if(c==null||pv==null)return"";const diff=c-pv;const cls=diff===0?"ts":(diff>0?"tu":"td");const pct=(diff*100).toFixed(0);return`<span class="tr ${cls}">${diff>0?"+":""}${pct}%</span>`;}

function killCH(){Object.values(CH).forEach(c=>{try{c.destroy();}catch(e){}});Object.keys(CH).forEach(k=>delete CH[k]);}
// Race guard: pokud se mezi naplánováním a spuštěním kresby grafů stihne spustit
// novější render (rychlé přepnutí hráčky/tabu), starší draw() se tiše přeskočí
// místo aby se pokusil nakreslit graf do plátna, které si mezitím vzal někdo jiný
// (dřív to padalo na "Canvas is already in use").
let _drawGen=0;
function scheduleDraw(fn){const gen=++_drawGen;setTimeout(()=>{if(gen===_drawGen)fn();},60);}
function renderTab(){
  const el=document.getElementById("tabContent");if(!el)return;killCH();
  if(S.activeTab==="physical"){el.innerHTML=buildPhys();scheduleDraw(drawPhys);}
  else if(S.activeTab==="game"){el.innerHTML=buildGame();scheduleDraw(drawGame);}
  else if(S.activeTab==="spider"){el.innerHTML=buildSpider();scheduleDraw(drawSpider);}
  else if(S.activeTab==="zapas")el.innerHTML=buildZapasTab();
  else el.innerHTML=buildMil();
}

// ═══ PHYSICAL ═══
function buildPhys(){
  const s=lS(),pv=pS();
  const activeRows=[],inactiveRows=[];
  S.config.physical.forEach(m=>{
    const isA=m.active!==false;
    const ntitle=m.note?'Poznámka: '+m.note.slice(0,40):'Přidat poznámku';
    const nb='<button class="note-btn '+(m.note?'has-note':'')+'" onclick="openNote(\'physical\',\''+m.id+'\')" title="'+ntitle+'">'+(m.note?'📝':'💬')+'</button>';
    if(m.id==="dosah_vyskoku"){
      const c=s?.physical?.dosah_vyskoku,pc=pv?.physical?.dosah_vyskoku,vys=calcVys(s),pvys=calcVys(pv);
      const row=`<div class="me ${isA?"":"inactive"}"><div class="ml">${m.label}${m.hint?`<small>${m.hint}</small>`:""}</div>${nb}${c!=null?`<span class="mv">${c}</span><span class="mu">${m.unit}</span>`:'<span style="color:var(--gm)">–</span>'}${trEl(c,pc,false)}</div>`;
      (isA?activeRows:inactiveRows).push(row);
      // Výskok je dopočítaný, ne samostatně vypínatelná metrika — vždy mezi aktivními.
      activeRows.push(`<div class="me"><div class="ml">Výskok <small>↳ dopočítáno</small></div>${vys!=null?`<span class="mv calc">${vys}</span><span class="mu">cm</span>`:'<span style="color:var(--gm)">–</span>'}${trEl(vys,pvys,false)}</div>`);
      return;
    }
    const c=s?.physical?.[m.id],pc=pv?.physical?.[m.id];
    const row=`<div class="me ${isA?"":"inactive"}"><div class="ml">${m.label}${m.hint?`<small>${m.hint}</small>`:""}</div>${nb}${c!=null?`<span class="mv">${c}</span><span class="mu">${m.unit}</span>`:'<span style="color:var(--gm)">–</span>'}${trEl(c,pc,m.lowerBetter)}</div>`;
    (isA?activeRows:inactiveRows).push(row);
  });
  const rows=activeRows.join("")+(inactiveRows.length?`<details class="inactive-metrics"><summary>Vypnuté metriky (${inactiveRows.length})</summary>${inactiveRows.join("")}</details>`:"");
  // Výskok je dopočítaná metrika, "vždy mezi aktivními" stejně jako v řádcích výše
  // (viz komentář u activeRows.push) — grafová karta se proto NEŘÍDÍ showGraph/active
  // vlastní syrové metriky dosah_vyskoku (ta má schválně showGraph:false, protože
  // graf SUROVÉHO "dosahu z výskoku" sám o sobě nikoho nezajímá — zajímá dopočítaný
  // rozdíl). Stejný princip appka už měla v PDF exportu (`renderPDFCharts`), jen tady
  // v appce chyběl — vedlejší oprava, Kolo 17.
  const vysCard=`<div class="card"><h3>Výskok — dopočítaný (cm)</h3><div class="cw"><canvas id="ch_vys"></canvas></div></div>`;
  const chs=vysCard+S.config.physical.filter(m=>m.id!=="dosah_vyskoku"&&m.active!==false&&m.showGraph!==false).map(m=>
    `<div class="card"><h3>${m.label} (${m.unit})</h3><div class="cw"><canvas id="ch_ph_${m.id}"></canvas></div></div>`
  ).join("");
  const hasG=true; // Výskok karta je teď vždy přítomna, takže grafový sloupec je vždy neprázdný.
  const p2=gP();
  const sessList=p2?.testSessions?.length?[...p2.testSessions].reverse().map((sess,ri)=>{
    const i=p2.testSessions.length-1-ri;
    return`<div class="me"><div class="ml">${fmtDate(sess.date)}${sess.note?` <small style="color:var(--acc)">📝 ${sess.note.slice(0,25)}</small>`:''}</div>
      <button class="btn btn-o sm" onclick="openEditTest(${i})">✎</button>
      <button class="btn btn-d sm" onclick="deleteTest(${i})">✕</button>
    </div>`;
  }).join(''):'<div class="no-data">Žádné testy</div>';
  return`<div class="${hasG?"g2":""}"><div>
    <div class="card"><h3>Poslední hodnoty &nbsp;<span style="font-weight:400;color:var(--gm)">💬 = podmínky</span></h3>${lS()?.note?`<div style="font-size:0.78rem;color:var(--acc);margin-bottom:10px;padding:6px 10px;background:rgba(232,200,64,.08);border-radius:6px;border-left:3px solid var(--acc)">📝 ${lS().note}</div>`:""}${rows||'<div class="no-data">Přidej první test</div>'}</div>
    <div class="card"><h3>Historie &nbsp;<span style="font-weight:400;color:var(--gm)">✎ upravit · ✕ smazat</span></h3>${sessList}</div>
  </div>${hasG?`<div>${chs}</div>`:""}</div>`;

// Pásmo "normálního kolísání" — sdílené mezi Herním (Kolo 16) a Fyzickým tabem
// (Kolo 17). Jemný obdélník v pozadí grafu, od (průměr hráčky − typický výkyv)
// do (průměr + typický výkyv), v NATIVNÍCH jednotkách dané metriky (%, cm, s…).
// Kreslí se `beforeDatasetsDraw`, tedy POD daty (sloupce/čára), ne přes ně.
// Ořezává se na pixely `chartArea`, ne na hodnoty — funguje tak stejně dobře na
// ose s pevným rozsahem (herní %, 0–100) jako na automaticky škálované ose
// fyzických metrik (žádný fixní strop/podlaha) i na obrácené ose (`lowerBetter`).
function swingBandPlugin(avg,halfW){
  return {id:"swingBand",beforeDatasetsDraw(chart){
    if(avg==null||halfW==null)return;
    const{ctx,chartArea,scales}=chart;if(!scales.y)return;
    let top=scales.y.getPixelForValue(avg+halfW), bot=scales.y.getPixelForValue(avg-halfW);
    if(top>bot)[top,bot]=[bot,top]; // obrácená osa (lowerBetter) má obrácené pixely
    top=Math.max(chartArea.top,top); bot=Math.min(chartArea.bottom,bot);
    if(bot<=top)return;
    ctx.save();
    ctx.fillStyle="rgba(130,130,120,0.28)";
    ctx.fillRect(chartArea.left,top,chartArea.right-chartArea.left,bot-top);
    ctx.restore();
  }};
}
function lineC(labels,data,rev,unitLabel,avg,swing){
  // Trend (klouzavý průměr) se kreslí až od 3 testování — s méně body by nešlo poznat
  // výkyv od trendu a čárkovaná linie by jen zbytečně kopírovala tu plnou.
  const showTrend=data.length>=3;
  const datasets=[{data,borderColor:CGREEN,backgroundColor:"rgba(61,184,74,0.08)",tension:0.35,pointRadius:4,pointBackgroundColor:CGREEN,fill:true,borderWidth:2}];
  if(showTrend)datasets.push({data:movingAvg3(data),borderColor:CTICK,backgroundColor:"transparent",borderDash:[5,3],tension:0.3,pointRadius:0,borderWidth:1.5,fill:false});
  // Pásmo normálního kolísání (Kolo 17) — `swing` je null, když computeNorms()
  // nenašel dost dvojic po sobě jdoucích testů napříč poolem (viz drawPhys).
  const showBand=swing!=null;
  const subParts=[];
  if(rev)subParts.push("↑ lepší výkon (osa obrácena)");
  if(showTrend)subParts.push("čárkovaně = klouzavý průměr");
  if(showBand)subParts.push("šedé pásmo = typický rozptyl mezi testy");
  return{type:"line",plugins:[swingBandPlugin(avg,swing)],data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,
    animation:{onComplete:function(){try{this.canvas.dataset.url=this.canvas.toDataURL('image/png');}catch(e){}}},
    plugins:{legend:{display:false},
      subtitle:subParts.length?{display:true,text:subParts.join(" · "),color:CTICK,font:{size:9},padding:{bottom:4}}:{display:false}
    },
    scales:{
      x:{grid:{color:CGRID},ticks:{color:CTICK,font:{size:10}}},
      y:{grid:{color:CGRID},ticks:{color:CTICK,font:{size:10},callback:v=>roundN(v)+(unitLabel?" "+unitLabel:"")},reverse:!!rev}
    }
  }};
}
function drawPhys(){
  const p=gP();if(!p)return;
  const norms=activeNorms();
  // Výskok karta je teď vždy v DOM (viz buildPhys) — kreslí se, kdykoli existuje

  const cvVys=document.getElementById("ch_vys");
  if(cvVys){
    const sess=p.testSessions?.filter(s=>calcVys(s)!=null)||[];
    if(sess.length){
      const vals=sess.map(s=>calcVys(s));
      const norm=norms["vyskok"];
      const swing=(norm?.swing!=null&&norm.swingN>=3)?norm.swing:null;
      CH.vys=new Chart(cvVys,lineC(sess.map(s=>fmtDate(s.date,true)),vals,false,'cm',mean(vals),swing));
    } else cvVys.parentElement.innerHTML='<div class="no-data">Žádná data</div>';
  }
  S.config.physical.filter(m=>m.id!=="dosah_vyskoku"&&m.active!==false&&m.showGraph!==false).forEach(m=>{
    const cv=document.getElementById("ch_ph_"+m.id);if(!cv)return;
    const sess=p.testSessions?.filter(s=>s.physical?.[m.id]!=null)||[];
    if(!sess.length){cv.parentElement.innerHTML='<div class="no-data">Žádná data</div>';return;}
    const vals=sess.map(s=>s.physical[m.id]);
    const norm=norms[m.id];
    const swing=(norm?.swing!=null&&norm.swingN>=3)?norm.swing:null;
    CH["ph_"+m.id]=new Chart(cv,lineC(sess.map(s=>fmtDate(s.date,true)),vals,m.lowerBetter,m.unit,mean(vals),swing));

}

// ═══ GAME ═══
function buildGame(){
  const s=lS(),pv=pS();
  const p=gP();const attackMerged=!!p?.attackHarderSince;
  const activeRows=[],inactiveRows=[];
  S.config.game.forEach(m=>{
    // Útok na cíl / Útok do pole: hráčka je vždy jen na JEDNÉ variantě (viz
    // activeAttackMetricId) — řádek té druhé se tu vůbec neukazuje, ani ztlumený
    // pod "Vypnuté metriky" (to je pro jinou věc — vypnuté v nastavení appky).
    if(m.id==="utok_pole"&&attackMerged)return;
    if(m.id==="utok_cil"&&!attackMerged)return;
    const isA=m.active!==false;
    const gs=gameScore(s?.game,m.id),gpv=gameScore(pv?.game,m.id);
    const pct=gamePct(gs),pctpv=gamePct(gpv);
    const pctDisp=pct!=null?Math.round(pct*100):null;
    const ntitle=m.note?'Poznámka: '+m.note.slice(0,40):'Přidat poznámku';
    const nb='<button class="note-btn '+(m.note?'has-note':'')+'" onclick="openNote(\'game\',\''+m.id+'\')" title="'+ntitle+'">'+(m.note?'📝':'💬')+'</button>';
    const row=`<div class="gi ${isA?"":"inactive"}"><div class="gl2">${m.label}</div>${nb}<div class="sb"><div class="sf" style="width:${pctDisp||0}%"></div></div>${gs!=null?`<div class="sc"><span style="font-size:1rem;font-family:'Bebas Neue',sans-serif;color:var(--gl)">${pctDisp}%</span><span style="font-size:0.7rem;color:var(--gm);margin-left:4px">${gs.score}/${gs.attempts}</span></div>`:'<div class="sc" style="color:var(--gm)">–</div>'}${trElPct(pct,pctpv)}</div>`;
    (isA?activeRows:inactiveRows).push(row);
  });
  const rows=activeRows.join("")+(inactiveRows.length?`<details class="inactive-metrics"><summary>Vypnuté metriky (${inactiveRows.length})</summary>${inactiveRows.join("")}</details>`:"");
  // Útok na cíl / Útok do pole: appka ukazuje vždy jen JEDNU kartu podle toho, na
  // které variantě hráčka zrovna je (activeAttackMetricId) — ne obě vedle sebe.
  // Dokud nemá nastavený přechod, je to karta "Útok do pole" (s tlačítkem na
  // označení přechodu); od data přechodu ji nahradí sloučená karta "Útok na cíl"
  // s jedním grafem (viz drawAttackMerged).
  const chs=S.config.game.filter(m=>m.active!==false).map(m=>{
    if(m.id==="utok_pole"){
      if(attackMerged)return"";
      return`<div class="card"><h3>${m.label} (%)</h3><div class="cw"><canvas id="ch_ga_utok_pole"></canvas></div><div style="text-align:right;margin-top:6px"><button class="btn btn-o sm" onclick="openAttackTransition()">🎯 Označit přechod na těžší variantu</button></div></div>`;
    }
    if(m.id==="utok_cil"){
      if(!attackMerged)return"";
      return`<div class="card"><h3>🎯 Útok — progres (lehčí → těžší)</h3><p style="font-size:0.75rem;color:var(--gm);margin-bottom:6px">Přešla na těžší variantu (Útok na cíl) <b>${fmtDate(p.attackHarderSince)}</b> · graf ukazuje T-skóre, srovnatelné napříč oběma variantami <button class="btn btn-o sm" onclick="openAttackTransition()" style="margin-left:4px">✎ Upravit</button></p><div class="cw"><canvas id="ch_ga_utok_cil"></canvas></div></div>`;
    }
    return`<div class="card"><h3>${m.label} (%)</h3><div class="cw"><canvas id="ch_ga_${m.id}"></canvas></div></div>`;
  }).join("");
  return`<div class="g2"><div><div class="card"><h3>Poslední výsledky &nbsp;<span style="font-weight:400;color:var(--gm)">💬 = podmínky</span></h3>${rows||'<div class="no-data">Přidej první test</div>'}</div></div><div>${chs}</div></div>`;
}
function drawGame(){
  const p=gP();if(!p)return;
  const norms=activeNorms();
  S.config.game.filter(m=>m.active!==false).forEach(m=>{
    const cv=document.getElementById("ch_ga_"+m.id);if(!cv)return;
    if(m.id==="utok_cil"&&p.attackHarderSince){drawAttackMerged(cv,p,norms);return;}
    const sess=p.testSessions?.filter(s=>gamePct(gameScore(s.game,m.id))!=null)||[];
    if(!sess.length){cv.parentElement.innerHTML='<div class="no-data">Žádná data</div>';return;}
    const pcts=sess.map(s=>Math.round(gamePct(gameScore(s.game,m.id))*100));
    // Stejná logika trendu jako u fyzických grafů (lineC) — čárkovaná linie navrch přes sloupce.
    const showTrend=pcts.length>=3;
    // Pásmo normálního kolísání — jen když computeNorms() napočítal dost dvojic
    // po sobě jdoucích testů napříč poolem (aspoň 3), jinak by byl odhad nespolehlivý.
    // Střed pásma je průměr TÉTO hráčky (ne poolu), šířka je typický výkyv z poolu — viz Kolo 16.
    const norm=norms[m.id];
    const avg100=mean(pcts);
    const showBand=norm?.swing!=null&&norm.swingN>=3;
    const swing100=showBand?norm.swing*100:null;
    const subtitleParts=[];
    if(showTrend)subtitleParts.push("čárkovaně = klouzavý průměr");
    if(showBand)subtitleParts.push("šedé pásmo = typický rozptyl mezi testy");
    const datasets=[{type:"bar",data:pcts,backgroundColor:pcts.map((_,i)=>i===pcts.length-1?CGREEN:"#1a4a22"),borderRadius:4,borderWidth:0,order:1}];
    if(showTrend)datasets.push({type:"line",data:movingAvg3(pcts),borderColor:CACC,backgroundColor:"transparent",borderDash:[5,3],tension:0.3,pointRadius:0,borderWidth:1.5,fill:false,order:0});
    CH["ga_"+m.id]=new Chart(cv,{type:"bar",plugins:[swingBandPlugin(avg100,swing100)],data:{labels:sess.map(s=>fmtDate(s.date,true)),datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},subtitle:subtitleParts.length?{display:true,text:subtitleParts.join(" · "),color:CTICK,font:{size:9},padding:{bottom:4}}:{display:false}},scales:{x:{grid:{color:CGRID},ticks:{color:CTICK,font:{size:10}}},y:{grid:{color:CGRID},ticks:{color:CTICK,font:{size:10},callback:v=>roundN(v)+"%"},min:0,max:100}}}});
  });
}
// Sloučený graf "Útok na cíl" / "Útok do pole" pro hráčku, která přešla na těžší
// variantu (p.attackHarderSince = datum přechodu). Obě metriky mají různou obtížnost
// (a tedy různou surovou úspěšnost), takže se NEPŘEVÁDÍ vzorcem mezi sebou — místo
// toho se obě vynesou jako T-skóre (každá vůči vlastní normě), což je srovnatelné.
// Sessions před datem přechodu čtou utok_pole (lehčí), od data přechodu utok_cil
// (těžší) — ale appka to teď kreslí jako JEDEN nepřerušený dataset (ne dvě série
// vedle sebe s mezerou): barva jednotlivých ÚSEKŮ čáry (Chart.js `segment`) se mění
// podle varianty, a bod přesně v místě přechodu dostane hvězdičku — "povýšení" je
// tak vizuálně jasné, ale datově/technicky je to pořád jedna spojitá věc.
function drawAttackMerged(cv,p,norms){
  const cutoff=p.attackHarderSince;
  const sess=(p.testSessions||[]).filter(s=>{
    const mid=s.date<cutoff?"utok_pole":"utok_cil";
    return gamePct(gameScore(s.game,mid))!=null;
  });
  if(!sess.length){cv.parentElement.innerHTML='<div class="no-data">Žádná data</div>';return;}
  const labels=sess.map(s=>fmtDate(s.date,true));
  const data=sess.map(s=>{
    const mid=s.date<cutoff?"utok_pole":"utok_cil";
    return tRaw(gamePct(gameScore(s.game,mid)),norms[mid]);
  });
  const upIdx=sess.findIndex(s=>s.date>=cutoff); // bod "povýšení" na těžší variantu
  const pointRadius=sess.map((_,i)=>i===upIdx?8:4);
  const pointStyle=sess.map((_,i)=>i===upIdx?"star":"circle");
  const pointColor=sess.map((_,i)=>i===upIdx?CACC:(sess[i].date<cutoff?CTICK:CGREEN));
  const vlinePlugin={id:"attackVline",afterDraw(chart){
    const{ctx,chartArea,scales}=chart;if(!scales.y)return;
    const y50=scales.y.getPixelForValue(50);
    ctx.save();ctx.strokeStyle="rgba(120,120,120,0.5)";ctx.lineWidth=1;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(chartArea.left,y50);ctx.lineTo(chartArea.right,y50);ctx.stroke();
    ctx.fillStyle="#666";ctx.font="9px sans-serif";ctx.fillText("T=50",chartArea.right+4,y50+4);
    if(upIdx>0){
      // Jemná svislá čára přesně v bodě přechodu — jen vodítko, ne hlavní signál
      // (ten je hvězdička na bodu).
      const x=scales.x.getPixelForTick(upIdx);
      ctx.strokeStyle="rgba(232,200,64,0.35)";ctx.lineWidth=1;ctx.setLineDash([2,3]);
      ctx.beginPath();ctx.moveTo(x,chartArea.top);ctx.lineTo(x,chartArea.bottom);ctx.stroke();
    }
    ctx.restore();
  }};
  CH["ga_utok_cil"]=new Chart(cv,{type:"line",plugins:[vlinePlugin],data:{labels,datasets:[{
    data,
    segment:{borderColor:ctx=>sess[ctx.p1DataIndex].date<cutoff?CTICK:CGREEN},
    borderColor:CGREEN,backgroundColor:"transparent",
    tension:0.3,borderWidth:2.5,spanGaps:false,
    pointRadius,pointStyle,pointBackgroundColor:pointColor,pointBorderColor:pointColor,pointBorderWidth:1.5,
  }]},options:{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:false},subtitle:{display:true,text:"šedá = lehčí varianta · zelená = těžší · ⭐ = přechod",color:CTICK,font:{size:9},padding:{bottom:4}}},
    scales:{x:{grid:{color:CGRID},ticks:{color:CTICK,font:{size:10}}},
      y:{grid:{color:CGRID},ticks:{color:CTICK,font:{size:10}},min:20,max:80,
        afterBuildTicks:axis=>{axis.ticks=[{value:20},{value:30},{value:45},{value:50},{value:60},{value:75},{value:80}];}}}
  }});
}
// ═══ ÚTOK — PŘECHOD NA TĚŽŠÍ VARIANTU ═══

// ═══ SPIDER ═══
function buildSpider(){
  const norms=activeNorms();const p=gP();const s=lS();
  const physM=S.config.physical.filter(m=>m.active!==false&&m.spider!==false&&m.id!=="dosah_vyskoku");

    ...S.config.game.filter(m=>m.active!==false).map(m=>{const gs=gameScore(s?.game,m.id);const pct=gamePct(gs);const t=tRaw(pct,norms[m.id]);return`<div class="me"><div class="ml">${m.label}</div>${gs!=null?`<span class="mv" style="font-size:1rem">${gs.score}/${gs.attempts}</span><span class="mu">${Math.round(pct*100)}%</span>`:'<span style="color:var(--gm)">–</span>'}${t!=null?`<span class="ts-badge ${tBadgeCls(t)}">T=${t} ${tBadgeLabel(t)}</span>`:'<span style="color:var(--gm);font-size:0.73rem">N/A</span>'}</div>`;}),

  return`<div class="norm-bar" id="normBarEl">${normBarInner()}</div>

  </div>

    <div class="card"><h3>💪 Fyzický profil</h3><div class="rw"><canvas id="rPhys"></canvas></div></div>

}
function spiderData(sess,norms){
  if(!sess)return null;
  const vys=calcVys(sess)||0;
  const physM=S.config.physical.filter(m=>m.active!==false&&m.spider!==false&&m.id!=="dosah_vyskoku");
  const pL=[...physM.map(m=>m.label),"Výskok"];
  const pD=[...physM.map(m=>tScore(sess.physical?.[m.id],norms[m.id])),tScore(vys,norms["vyskok"])];
  const gm=S.config.game.filter(m=>m.active!==false);
  const gL=gm.map(m=>m.label);
  const gD=gm.map(m=>{const gs=gameScore(sess.game,m.id);return tScore(gamePct(gs),norms[m.id]);});
  return{pL,pD,gL,gD};
}
function mkRadar(id,labels,cur,prev){
  const cv=document.getElementById(id);if(!cv)return;
  if(!labels?.length){cv.parentElement.innerHTML='<div class="no-data">Žádná data</div>';return;}
  const threshold=((75-20)/60*100);
  const ptColors=(cur||[]).map(v=>v>=threshold?CACC:CGREEN);
  const ds=[
    {label:"Aktuální",data:cur||labels.map(()=>0),borderColor:CGREEN,backgroundColor:"rgba(61,184,74,0.15)",pointBackgroundColor:ptColors,pointRadius:5,borderWidth:2},
  ];
  if(prev)ds.push({label:"Předchozí",data:prev,borderColor:"#555",backgroundColor:"rgba(80,80,80,0.05)",pointBackgroundColor:"#555",pointRadius:3,borderWidth:1,borderDash:[4,4]});
  // "Průměr" (Kolo 18) — referenční prstenec přesně na T=50, tj. průměr AKTUÁLNÍHO
  // referenčního poolu (Tým/Databáze, podle scopeChip). T-skóre je z definice
  // postavené tak, že průměr poolu vždy vychází na 50 na téhle 0–100 zobrazovací
  // ose — appka proto nic nedopočítává navíc, jen nakreslí plochý dataset "50"
  // na všech osách. Když se přepne scope (viz toggleNormScope), tenhle prstenec
  // se NEHÝBE (pořád 50) — mění se `cur`/`prev`, tedy vidíš, jak se hráčka vůči
  // téhle stejné referenci posouvá. Bez výplně, tečkovaně, bez legendy (viz filter).
  // Přidává se AŽ NAKONEC pole (kreslí se navrch) a barvou CLEG (ne CTICK) —
  // ověřeno pixel-sample testem, že jinak splývá pod translucentní výplní Aktuální.
  ds.push({label:"Průměr",data:labels.map(()=>50),borderColor:CLEG,backgroundColor:"transparent",borderWidth:1.5,borderDash:[3,3],pointRadius:0});
  CH[id]=new Chart(cv,{type:"radar",data:{labels,datasets:ds},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:CLEG,font:{size:11},filter:item=>item.text!=="Průměr"}}},scales:{r:{min:0,max:100,grid:{color:"#2a3a2a"},angleLines:{color:"#2a3a2a"},pointLabels:{color:CLEG,font:{size:10}},ticks:{display:false}}}}});
}
function drawSpider(){
  const showP=document.getElementById("prevTog")?.checked;
  const norms=activeNorms();
  const cur=spiderData(lS(),norms),prev=showP?spiderData(pS(),norms):null;
  if(CH.rPhys){CH.rPhys.destroy();delete CH.rPhys;}
  if(CH.rGame){CH.rGame.destroy();delete CH.rGame;}
  mkRadar("rPhys",cur?.pL,cur?.pD,prev?.pD);
  mkRadar("rGame",cur?.gL,cur?.gD,prev?.gD);
  const p2=gP();if(p2)drawTsTimeline(p2,norms);
}

function drawCmp(sel,norms){
  const phAct=S.config.physical.filter(m=>m.active!==false&&m.id!=="dosah_vyskoku"&&m.id!=="dosah");
  const gaAct=S.config.game.filter(m=>m.active!==false);

                  y:{grid:{display:false},ticks:{color:CW,font:{size:11}}}}}});
    }
  }
}

function tBadgeStyle(t){
  if(t==null)return'background:#eee;color:#666';
  if(t>=75)return'background:linear-gradient(90deg,var(--gold-1),var(--gold-2),var(--gold-1));background-size:200%;color:#000';
  if(t>=60)return'background:#d4f0dc;color:#1a5e2a';
  if(t>=45)return'background:#e8f5e8;color:#3a7a3a';
  if(t>=30)return'background:#fff0d0;color:#a05000';
  return'background:#ffe0c0;color:#8b2500';
}

function exportPDF(){
  const p=gP();if(!p)return;
  const sessions=p.testSessions||[];
  if(!sessions.length){toast("Hráčka nemá žádné testy","err");return;}
  const norms=activeNorms();
  const s=lS(p);
  const first=sessions[0];

  // BADGES
  const badgesHtml=p.badges.map(id=>{
    const b=S.config.badges.find(x=>x.id===id);
    if(!b)return'';
    return`<span class="pdf-badge-inline" style="background:${b.color}33;border:1.5px solid ${b.color};color:${b.color}">${b.icon} ${b.label}</span>`;
  }).join('')||'<span style="color:#aaa">–</span>';

  // PHYSICAL TABLE
  const physRows=S.config.physical.filter(m=>m.active!==false).map(m=>{
    if(m.id==='dosah_vyskoku'){
      const vals=sessions.map(ss=>calcVys(ss)).filter(v=>v!=null);
      if(!vals.length)return`<tr><td>Výskok (dopočítaný)</td><td colspan="3" style="color:#aaa">Bez dat</td></tr>`;
      const diff=Math.round((vals[vals.length-1]-vals[0])*10)/10;
      const tc=diff>0?'pdf-up':diff<0?'pdf-dn':'';
      const t=tRaw(vals[vals.length-1],norms['vyskok']);
      return`<tr><td>Výskok</td><td>${vals[0]} cm</td><td><b>${vals[vals.length-1]} cm</b></td><td class="${tc}">${diff>0?'+':''}${diff} cm</td><td>${t!=null?`<span class="pdf-badge-inline" style="${tBadgeStyle(t)}">T=${t}</span>`:''}</td></tr>`;
    }
    const vals=sessions.map(ss=>ss.physical?.[m.id]).filter(v=>v!=null);
    if(!vals.length)return`<tr><td>${m.label}</td><td colspan="4" style="color:#aaa">Bez dat</td></tr>`;
    const diff=Math.round((vals[vals.length-1]-vals[0])*100)/100;
    const better=m.lowerBetter?diff<0:diff>0;
    const tc=diff===0?'':better?'pdf-up':'pdf-dn';
    const t=tRaw(vals[vals.length-1],norms[m.id]);
    return`<tr><td>${m.label}</td><td>${vals[0]} ${m.unit}</td><td><b>${vals[vals.length-1]} ${m.unit}</b></td><td class="${tc}">${diff>0?'+':''}${diff} ${m.unit}</td><td>${t!=null?`<span class="pdf-badge-inline" style="${tBadgeStyle(t)}">T=${t}</span>`:''}</td></tr>`;

  const normInfo=S.lockedNorms?`Uzamčená norma ${S.lockedNorms.ts}`:`Dynamická norma · ${S.normScope==="current"?"aktuální tým":"celá databáze"} (${normPlayers().length} hráček)`;
  const printDate=today();

  const html=`<div class="pdf-wrap" id="pdfOverlay">
    <div class="pdf-doc" id="pdfContent">

        <div>

          <thead><tr><th>Datum</th>${S.config.physical.filter(m=>m.active!==false&&m.id!=='dosah_vyskoku').map(m=>`<th>${m.label.split(' ')[0]}</th>`).join('')}<th>Výskok</th>${S.config.game.filter(m=>m.active!==false).map(m=>`<th>${m.label.split(' ')[0]}</th>`).join('')}</tr></thead>

function printPDF(){
  const doc=document.getElementById('pdfContent');if(!doc)return;
  const overlay=document.getElementById('pdfOverlay');
  if(overlay)overlay.scrollTop=0;
  const canvases=doc.querySelectorAll('canvas');
  const imgs=[];
  // Use pre-captured URL from animation.onComplete, fallback to fresh toDataURL
  canvases.forEach(cv=>{
    try{
      const dataUrl=cv.dataset.url||cv.toDataURL('image/png');
      if(!dataUrl||dataUrl==='data:,')return;
      const img=document.createElement('img');
      img.src=dataUrl;
      img.className='pdf-chart-img';
      img.style.cssText='width:100%;height:auto;max-height:110px;object-fit:contain;border-radius:4px;display:block;margin-top:4px';
      cv.parentNode.insertBefore(img,cv.nextSibling);
      cv.style.display='none';
      imgs.push({cv,img});
    }catch(e){console.warn('canvas capture failed',e);}
  });
  // Wait for images to load then print
  const allImgs=doc.querySelectorAll('.pdf-chart-img');
  let loaded=0;const total=allImgs.length;
  function doPrint(){window.print();setTimeout(()=>{imgs.forEach(({cv,img})=>{cv.style.display='';img.remove();});},1500);}
  if(total===0){setTimeout(doPrint,200);return;}
  allImgs.forEach(img=>{
    if(img.complete){loaded++;if(loaded>=total)setTimeout(doPrint,200);}
    else{img.onload=()=>{loaded++;if(loaded>=total)setTimeout(doPrint,200);};
         img.onerror=()=>{loaded++;if(loaded>=total)setTimeout(doPrint,200);};}
  });
  // Fallback if no onload fires
  setTimeout(doPrint,800);
}

function renderPDFTop5(p){
  const container=document.getElementById('pdfTop5Container');
  if(!container)return;
  const norms=activeNorms();
  const s=lS(p);
  if(!s){container.innerHTML='<p style="color:#aaa;font-size:0.81rem">Žádný test</p>';return;}
  // Collect all T-scores
  const metrics=[];
  S.config.physical.filter(m=>m.active!==false&&m.spider!==false&&m.id!=='dosah_vyskoku').forEach(m=>{
    const val=s.physical?.[m.id];const t=tRaw(val,norms[m.id]);
    if(t!=null)metrics.push({label:m.label,t,val:val+' '+m.unit,norm:norms[m.id]});
  });
  const vysVal=calcVys(s);
  const tVys=tRaw(vysVal,norms['vyskok']);
  if(tVys!=null)metrics.push({label:'Výskok',t:tVys,val:vysVal+' cm',norm:norms['vyskok']});
  S.config.game.filter(m=>m.active!==false).forEach(m=>{
    const gs=gameScore(s.game,m.id);const pct=gamePct(gs);const t=tRaw(pct,norms[m.id]);
    if(t!=null)metrics.push({label:m.label,t,val:gs?Math.round(pct*100)+'%':'–',norm:norms[m.id]});
  });
  if(!metrics.length){container.innerHTML='<p style="color:#aaa;font-size:0.81rem">Nedostatek dat pro T-score</p>';return;}
  metrics.sort((a,b)=>b.t-a.t);
  const top5=metrics.slice(0,5);
  // Bar chart comparing player T vs 50 (team average)
  const html=top5.map(m=>{
    const pct=Math.max(0,Math.min(100,((Math.max(20,Math.min(80,m.t))-20)/60)*100));
    const color=m.t>=75?'#c8a820':m.t>=60?CG:m.t>=45?'#3a7a3a':m.t>=30?'#a05000':'#8b2500';
    const avgPct=((50-20)/60*100); // T=50 mapped to 0-100
    return`<div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:3px">
        <span>${m.label}</span>
        <span style="color:${color};font-weight:700">${m.val} &nbsp; T=${m.t}</span>
      </div>
      <div style="background:#eee;border-radius:6px;height:18px;position:relative;overflow:hidden">
        <!-- team average marker -->
        <div style="position:absolute;left:${avgPct}%;top:0;bottom:0;width:2px;background:#999;z-index:2"></div>
        <!-- player bar -->
        <div style="width:${pct}%;height:100%;background:${color}33;border-right:3px solid ${color};border-radius:6px;transition:width .4s;position:relative;z-index:1"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:0.68rem;color:#999;margin-top:2px"><span>0</span><span>↑ průměr týmu (T=50)</span><span>100</span></div>
    </div>`;
  }).join('');
  container.innerHTML=html;
}

function renderPDFCharts(p,sessions){
  renderPDFTop5(p);
  const grid=document.getElementById('pdfChartsGrid');
  if(!grid)return;
  const chartDefs=[];
  // Physical metrics with graphs
  S.config.physical.filter(m=>m.active!==false&&m.showGraph!==false&&m.id!=='dosah_vyskoku').forEach(m=>{
    const vals=sessions.filter(s=>s.physical?.[m.id]!=null);
    if(vals.length<2)return;
    chartDefs.push({label:m.label+' ('+m.unit+')',labels:vals.map(s=>fmtDate(s.date,true)),data:vals.map(s=>s.physical[m.id]),color:CG,reverse:!!m.lowerBetter,unit:m.unit});
  });
  // Výskok
  const vysVals=sessions.filter(s=>calcVys(s)!=null);
  if(vysVals.length>=2)chartDefs.push({label:'Výskok (cm)',labels:vysVals.map(s=>fmtDate(s.date,true)),data:vysVals.map(s=>calcVys(s)),color:'#1a6e5a',reverse:false,unit:'cm'});
  // Game metrics
  S.config.game.filter(m=>m.active!==false).forEach(m=>{
    const vals=sessions.filter(s=>gamePct(gameScore(s.game,m.id))!=null);
    if(vals.length<2)return;
    chartDefs.push({label:m.label+' (%)',labels:vals.map(s=>fmtDate(s.date,true)),data:vals.map(s=>Math.round(gamePct(gameScore(s.game,m.id))*100)),color:'#1a4d8a',ymax:100,unit:'%'});
  });
  if(!chartDefs.length){
    grid.innerHTML='<p style="color:#aaa;font-size:0.81rem;grid-column:1/-1">Alespoň 2 testování jsou potřeba pro zobrazení grafů.</p>';
    return;
  }
  chartDefs.forEach((def,ci)=>{
    const wrap=document.createElement('div');
    wrap.className='pdf-chart-box';wrap.style.cssText='background:#f9f9f9;border:1px solid #e0e0e0;border-radius:8px;padding:10px 10px 4px;break-inside:avoid';
    wrap.innerHTML=`<h3>${def.label}</h3><canvas id="pdfC_${ci}" style="display:block;width:100%;height:130px"></canvas>`;
    grid.appendChild(wrap);
    const cv=document.getElementById('pdfC_'+ci);
    const minV=Math.min(...def.data);const maxV=Math.max(...def.data);
    const pad=(maxV-minV)*0.15||1;
    new Chart(cv,{type:'line',data:{labels:def.labels,datasets:[{
      data:def.data,
      borderColor:def.color,
      backgroundColor:def.color+'22',
      tension:0.35,pointRadius:5,pointBackgroundColor:def.color,
      fill:true,borderWidth:2.5,
      pointStyle:'circle',
    }]},options:{responsive:false,maintainAspectRatio:false,
      animation:{onComplete:function(){try{cv.dataset.url=cv.toDataURL('image/png');}catch(e){}}},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+roundN(ctx.parsed.y)+(def.ymax?'%':'')}}},
      scales:{
        x:{grid:{color:'#e8e8e8'},ticks:{color:'#666',font:{size:10}}},
        y:{grid:{color:'#e8e8e8'},ticks:{color:'#666',font:{size:10}},
          reverse:def.reverse||false,
          min:def.ymax?0:(def.reverse?minV-pad:minV-pad),
          max:def.ymax?def.ymax:(def.reverse?maxV+pad:maxV+pad),
        }
      }
    }});
  });
}

    <p style="font-size:0.75rem;color:var(--gm);margin-top:8px">Archivované hráčky lze obnovit v sekci Archiv sezón.</p>
    <div class="ma">
      <button class="btn btn-o" onclick="closeModal()">Zrušit</button>
      <button class="btn btn-p" onclick="doArchive()">Uzavřít sezónu</button>

function archSelectAll(val){
  getActiveP().forEach(p=>{
    const cb=document.getElementById('arch_'+p.id);
    if(cb)cb.checked=val;
  });
}

function doArchive(){
  const name=document.getElementById('archSeasonName')?.value.trim()||'Archiv';
  const toArchive=getActiveP().filter(p=>document.getElementById('arch_'+p.id)?.checked);
  if(!toArchive.length){toast("Nevybral jsi žádnou hráčku k archivaci","err");return;}
  const archDate=today();
  // Save season record
  if(!S.seasons)S.seasons=[];
  S.seasons.push({name,date:archDate,playerIds:toArchive.map(p=>p.id)});
  // Mark players as archived
  toArchive.forEach(p=>{p.archived=true;});
  // Reset active selection if archived
  if(S.activeId&&!getActiveP().find(p=>p.id===S.activeId)){
    S.activeId=getActiveP()[0]?.id||null;
  }
  save();closeModal();render();
  toast(`Sezóna "${name}" archivována — ${toArchive.length} hráček`);
}

function openArchiveView(){
  if(!S.seasons?.length&&!getArchivedP().length){
    openModal(`<h2>🗂 Archiv sezón</h2><div class="no-data" style="padding:30px 0">Žádné archivované sezóny</div><div class="ma"><button class="btn btn-p" onclick="closeModal()">Zavřít</button></div>`);
    return;
  }
  const seasons=S.seasons||[];
  const orphans=getArchivedP().filter(p=>!seasons.some(s=>s.playerIds.includes(p.id)));
  const seasonBlocks=seasons.map((s,si)=>{
    const players=S.players.filter(p=>s.playerIds.includes(p.id));
    const playerRows=players.map(p=>`
      <div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--brd);font-size:0.82rem">
        <span style="flex:1">${p.name} <small style="color:var(--gm)">Nar. ${p.birthYear} · ${p.testSessions?.length||0} testů</small></span>
        <button class="btn btn-o sm" onclick="restorePlayer('${p.id}');openArchiveView()">↩ Obnovit</button>
      </div>`).join('');
    return`<div style="background:#0a140a;border:1px solid var(--brd);border-radius:10px;padding:14px;margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <div style="flex:1"><b>${s.name}</b> <span style="font-size:0.73rem;color:var(--gm)">${fmtDate(s.date)}</span></div>
        <button class="btn btn-d sm" onclick="deleteSeason(${si})">✕</button>
      </div>
      ${playerRows}
    </div>`;
  }).join('');
  const orphanRows=orphans.map(p=>`
    <div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--brd);font-size:0.82rem">
      <span style="flex:1">${p.name} <small style="color:var(--gm)">Nar. ${p.birthYear}</small></span>
      <button class="btn btn-o sm" onclick="restorePlayer('${p.id}');openArchiveView()">↩ Obnovit</button>
    </div>`).join('');
  openModal(`<h2>🗂 Archiv sezón</h2>
    <p style="font-size:0.8rem;color:var(--gm);margin-bottom:14px">Archivované hráčky se nezobrazují v aktivním seznamu, ale jejich data posilují T-score normy.</p>
    ${seasonBlocks}
    ${orphans.length?`<div style="background:#0a140a;border:1px solid var(--brd);border-radius:10px;padding:14px;margin-bottom:12px"><div style="font-weight:600;margin-bottom:8px;font-size:0.82rem;color:var(--gm)">Ostatní archivované hráčky</div>${orphanRows}</div>`:''}
    <div class="ma"><button class="btn btn-p" onclick="closeModal()">Zavřít</button></div>`);
}

function restorePlayer(id){
  const p=S.players.find(x=>x.id===id);
  if(!p)return;
  delete p.archived;
  save();render();toast(p.name+' obnovena do aktivního seznamu');
}

function deleteSeason(si){
  confirmAction('Smazat záznam sezóny? Hráčky zůstanou archivované, jen zmizí záznam o sezóně.',()=>{
    S.seasons.splice(si,1);
    save();
    openArchiveView();
  });
}

// STALE TEST INDICATOR
// ═══════════════════════════════════════════════
function staleDot(p){
  if(!p.testSessions?.length) return '<span class="stale-dot red" title="Zatím bez testu"></span>';
  const last = p.testSessions[p.testSessions.length-1].date;
  const days = Math.floor((Date.now() - new Date(last).getTime()) / 86400000);
  if(days > 60) return `<span class="stale-dot red" title="Poslední test: ${fmtDate(last)} (${days} dní)"></span>`;
  if(days > 30) return `<span class="stale-dot" title="Poslední test: ${fmtDate(last)} (${days} dní)"></span>`;
  return '';
}

    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:12px">
      <table class="grp-tbl">
        <thead><tr><th>Hráčka</th>${phHeads}${gaHeads}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="fg"><label>Poznámka k testování (volitelně)</label><textarea id="grpNote" placeholder="Podmínky, únava..."></textarea></div>
    <div class="ma"><button class="btn btn-o" onclick="closeModalConfirm('Zahodit rozepsaný skupinový test? Zadané hodnoty pro celý tým se ztratí.')">Zrušit</button><button class="btn btn-p" onclick="saveGroupTest()">Uložit vše</button></div>`);
  setTimeout(snapModal,90);
}
function saveGroupTest(){
  const date=document.getElementById('grpDate').value;
  const attempts=parseInt(document.getElementById('grpAttempts')?.value)||15;
  const note=document.getElementById('grpNote')?.value.trim()||undefined;
  const phA=S.config.physical.filter(m=>m.active!==false);
  const gaA=S.config.game.filter(m=>m.active!==false);
  let saved=0;
  getActiveP().forEach(p=>{
    const physical={};
    phA.forEach(m=>{const v=parseFloat(document.getElementById(`g_ph_${p.id}_${m.id}`)?.value);if(!isNaN(v))physical[m.id]=v;});
    const game={};
    gaA.forEach(m=>{const v=parseInt(document.getElementById(`g_ga_${p.id}_${m.id}`)?.value);if(!isNaN(v))game[m.id]={score:v,attempts};});
    if(!Object.keys(physical).length&&!Object.keys(game).length) return;
    if(!p.testSessions)p.testSessions=[];
    p.testSessions=p.testSessions.filter(s=>s.date!==date);
    p.testSessions.push({date,physical,game,note});
    p.testSessions.sort((a,b)=>a.date.localeCompare(b.date));
    saved++;
  });
  save();closeModal();
  if(S.activeId&&gP())renderDetail();
  toast(`Uloženo pro ${saved} hráček ✓`);
}

function renderOverview(){
